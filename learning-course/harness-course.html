<title>Harness 拆裝手冊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface-2:#E7ECF1;
  --surface-3:#DCE3EA;
  --ink:#151E27;
  --ink-dim:#57646F;
  --border:#D2DAE1;
  --accent:#1B6E8C;
  --accent-strong:#0F4F66;
  --accent-soft:#DCEEF4;
  --pass:#2F7A50;
  --pass-soft:#E1F2E7;
  --warn:#A8402F;
  --warn-soft:#F7E4E1;
  --code-bg:#0E141A;
  --code-ink:#D8E1E8;
  --code-key:#7FC7E8;
  --code-str:#E3B673;
  --code-com:#5C6B77;
  --code-num:#B79AD9;
  --shadow: 0 1px 2px rgba(21,30,39,.06), 0 8px 24px -12px rgba(21,30,39,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B;
    --surface:#131C25;
    --surface-2:#1A2530;
    --surface-3:#20303C;
    --ink:#E6ECF1;
    --ink-dim:#8CA0AC;
    --border:#2A3946;
    --accent:#5FB9DD;
    --accent-strong:#8FD2EC;
    --accent-soft:#173B49;
    --pass:#6FC08A;
    --pass-soft:#173423;
    --warn:#E08A79;
    --warn-soft:#3A211D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B;
  --surface:#131C25;
  --surface-2:#1A2530;
  --surface-3:#20303C;
  --ink:#E6ECF1;
  --ink-dim:#8CA0AC;
  --border:#2A3946;
  --accent:#5FB9DD;
  --accent-strong:#8FD2EC;
  --accent-soft:#173B49;
  --pass:#6FC08A;
  --pass-soft:#173423;
  --warn:#E08A79;
  --warn-soft:#3A211D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  line-height:1.6;
}
h1,h2,h3{text-wrap:balance; font-family:'IBM Plex Sans', sans-serif; color:var(--ink); margin:0;}
p{margin:0 0 1em; color:var(--ink);}
code, pre{font-family:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace; overflow-wrap:anywhere;}
a{color:var(--accent);}
::selection{background:var(--accent-soft); color:var(--accent-strong);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ---------- app shell ---------- */
.app{
  display:grid;
  grid-template-columns: 300px minmax(0,1fr);
  min-height:100vh;
}
@media (max-width: 900px){
  .app{ grid-template-columns: 1fr; }
}

/* ---------- sidebar ---------- */
.rail{
  position:sticky; top:0; align-self:start; height:100vh;
  border-right:1px solid var(--border);
  background:var(--surface-2);
  display:flex; flex-direction:column;
  padding:28px 22px;
  gap:22px;
  overflow-y:auto;
}
@media (max-width: 900px){
  .rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
}

.brand .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
.brand h1{
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:800; font-size:34px; letter-spacing:.01em; line-height:1;
  margin-top:6px;
}
.brand .sub{ color:var(--ink-dim); font-size:13.5px; margin-top:8px; }

.progress-block{ display:flex; flex-direction:column; gap:8px; }
.progress-label{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-dim);
}
.progress-label b{ color:var(--ink); font-variant-numeric:tabular-nums; }
.meter{
  height:8px; border-radius:2px; background:var(--surface-3);
  overflow:hidden; border:1px solid var(--border);
  display:flex; gap:2px; padding:2px;
}
.meter i{ display:block; flex:1; border-radius:1px; background:transparent; }
.meter i.on{ background:var(--accent); }

.chnav{ list-style:none; margin:0; padding:0; position:relative; }
.chnav::before{
  content:""; position:absolute; left:13px; top:6px; bottom:6px; width:2px;
  background:var(--border);
}
.chnav li{ position:relative; }
.chnode{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:12px;
  width:100%; padding:9px 8px 9px 0; cursor:pointer; border-radius:6px;
}
.chnode:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.chnode .dot{
  position:relative; z-index:1; flex:none; width:26px; height:26px; border-radius:50%;
  background:var(--surface); border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; color:var(--ink-dim);
}
.chnode .label{ display:flex; flex-direction:column; min-width:0; }
.chnode .t{ font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chnode .k{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-dim); letter-spacing:.06em; }

.chnav li[data-state="active"] .chnode .dot{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.chnav li[data-state="active"] .chnode .t{ color:var(--accent-strong); font-weight:600; }
.chnav li[data-state="passed"] .chnode .dot{ background:var(--pass); border-color:var(--pass); color:var(--pass-soft); }
.chnav li[data-state="passed"] .chnode .dot::after{ content:"✓"; }
.chnav li[data-state="soon"] .chnode{ cursor:default; }
.chnav li[data-state="soon"] .chnode .dot{ border-style:dashed; }

.rail-foot{ margin-top:auto; padding-top:10px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; }

/* ---------- main content ---------- */
main{ min-width:0; padding:52px 40px 120px; }
@media (max-width: 700px){ main{ padding:34px 18px 90px; } }
.wrap{ max-width:700px; margin:0 auto; }

.ch-head .eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent); font-weight:600; display:flex; align-items:center; gap:10px;
}
.ch-head .eyebrow .num{
  font-family:'Big Shoulders Display', sans-serif; font-size:16px; letter-spacing:0;
  background:var(--accent-soft); color:var(--accent-strong); padding:1px 8px; border-radius:3px;
}
.ch-head h2{
  font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:44px; line-height:1.02;
  margin-top:10px;
}
.ch-head .dek{ color:var(--ink-dim); font-size:16px; margin-top:12px; max-width:60ch; }

.chapter{ display:none; }
.chapter[data-active="true"]{ display:block; }

.section{ margin-top:40px; }
.section h3{ font-size:20px; font-weight:700; margin-bottom:12px; }
.section h4{ font-size:15px; font-weight:600; margin:20px 0 8px; color:var(--ink); }
.section p{ font-size:15.5px; max-width:66ch; overflow-wrap:break-word; }
.section ul, .section ol{ margin:0 0 1em; padding-left:22px; max-width:64ch; }
.section li{ margin-bottom:6px; font-size:15.5px; overflow-wrap:break-word; }
.section strong{ color:var(--ink); }

.callout{
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:16px 18px; margin:18px 0; box-shadow:var(--shadow);
  border-left:3px solid var(--accent); overflow-wrap:break-word;
}
.callout .k{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px; display:block; }
.callout p:last-child{ margin-bottom:0; }
.callout.warn{ border-left-color:var(--warn); }
.callout.warn .k{ color:var(--warn); }

pre.code{
  background:var(--code-bg); color:var(--code-ink);
  border-radius:10px; padding:18px 20px; margin:16px 0;
  overflow-x:auto; font-size:13px; line-height:1.65; box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.06);
}
pre.code .k{ color:var(--code-key); }
pre.code .s{ color:var(--code-str); }
pre.code .c{ color:var(--code-com); font-style:italic; }
pre.code .n{ color:var(--code-num); }

.diagram{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; margin:18px 0; overflow-x:auto; box-shadow:var(--shadow); }
.diagram svg{ display:block; margin:0 auto; }
.diagram .cap{ margin-top:10px; font-size:12.5px; color:var(--ink-dim); text-align:center; }
.dg-box{ fill:var(--surface-2); stroke:var(--border); stroke-width:1.5; }
.dg-box.accent{ fill:var(--accent-soft); stroke:var(--accent); }
.dg-line{ stroke:var(--ink-dim); stroke-width:1.5; fill:none; }
.dg-arrow{ fill:var(--ink-dim); }
.dg-text{ fill:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; }
.dg-mono{ fill:var(--ink-dim); font-family:'IBM Plex Mono', monospace; font-size:10.5px; }

.table-wrap{ overflow-x:auto; margin:16px 0; border-radius:10px; box-shadow:var(--shadow); }
.section table{ width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); }
.section table th, .section table td{ text-align:left; padding:9px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
.section table th{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; background:var(--surface-2); white-space:nowrap; }
.section table td .mono{ font-size:12.5px; }
.section table tr:last-child td{ border-bottom:none; }

.soon-panel{
  border:1px dashed var(--border); border-radius:12px; padding:34px 28px; text-align:center;
  color:var(--ink-dim); margin-top:32px; background:var(--surface);
}
.soon-panel .tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
.soon-panel h4{ color:var(--ink); font-size:18px; margin:10px 0 6px; }
.soon-panel p{ max-width:50ch; margin:0 auto; font-size:14px; }

/* ---------- quiz ---------- */
.quiz{ margin-top:44px; border-top:1px solid var(--border); padding-top:28px; }
.quiz-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.quiz-head h3{ font-size:20px; }
.quiz-head .hint{ font-size:12.5px; color:var(--ink-dim); font-family:'IBM Plex Mono', monospace; }
.quiz-q{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-top:16px; box-shadow:var(--shadow); }
.quiz-q .q-text{ font-weight:600; font-size:15px; margin-bottom:12px; }
.quiz-q .opt{ display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14.5px; }
.quiz-q .opt:hover{ background:var(--surface-2); }
.quiz-q input[type="radio"]{ margin-top:3px; accent-color:var(--accent); flex:none; }
.q-feedback{ margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; }
.q-feedback.correct{ background:var(--pass-soft); color:var(--pass); }
.q-feedback.wrong{ background:var(--warn-soft); color:var(--warn); }

.quiz-actions{ display:flex; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.btn{
  all:unset; box-sizing:border-box; font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px;
  padding:11px 20px; border-radius:8px; cursor:pointer; background:var(--accent); color:#fff;
  transition:filter .15s ease;
}
.btn:hover{ filter:brightness(1.08); }
.btn:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
.btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--ink); }
.ch-link{ all:unset; color:var(--accent); text-decoration:underline; cursor:pointer; font:inherit; }
.ch-link:hover{ filter:brightness(1.1); }
.quiz-msg{ font-size:13.5px; font-weight:600; }
.quiz-msg.ok{ color:var(--pass); }
.quiz-msg.bad{ color:var(--warn); }

.chapter-nav{ display:flex; justify-content:space-between; margin-top:48px; padding-top:20px; border-top:1px solid var(--border); }

@keyframes pop{ from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
.celebrate{ animation:pop .25s ease; }
</style>

var CH = [

  {n:4, key:"Context 管理", title:"Context 管理與壓縮", dek:"對話會一直長大，但 context window 不會。快取、清除、壓縮三種對策。", status:"ready"},

  {n:6, key:"狀態持久化", title:"狀態持久化：Session 怎麼存", dek:"Harness 什麼時候把東西寫到硬碟？寫在哪裡？用什麼格式？", status:"ready"},

  {n:10, key:"整體架構", title:"把所有東西兜起來", dek:"hermes-agent 的完整地圖：模組、資料流、以及東西最終寫在哪裡。", status:"ready"},
  {n:11, key:"工具與搜尋", title:"工具目錄與 Tool Search", dek:"工具怎麼分類、終端機後端怎麼隔離、文件怎麼被讀懂、工具太多時怎麼辦。", status:"ready"},

var STORE_KEY = "harness-course-progress-v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
}
var progress = loadProgress();
var active = 1;
for (var i=1;i<=17;i++){ if(progress[i]){ active = Math.min(i+1,17); } }

function chapterState(n){
  var chDef = CH[n-1];
  if (chDef.status === "soon") return progress[n] ? "passed" : "soon";
  if (progress[n]) return "passed";
  if (n === active) return "active";
  return "unlocked";
}

function renderNav(){
  var ul = document.getElementById('chnav');
  ul.innerHTML = "";
  var passedCount = 0;
  CH.forEach(function(c){ if(progress[c.n]) passedCount++; });
  document.getElementById('progress-text').textContent = passedCount + " / 17";
  var meter = document.getElementById('meter');
  meter.innerHTML = "";
  for (var i=1;i<=17;i++){
    var seg = document.createElement('i');
    if (progress[i]) seg.className = "on";
    meter.appendChild(seg);
  }

  CH.forEach(function(c){
    var state = chapterState(c.n);
    var li = document.createElement('li');
    li.setAttribute('data-state', state === "active" ? "active" : (state === "passed" ? "passed" : (state === "soon" ? "soon" : "")));
    var btn = document.createElement('button');
    btn.className = "chnode";
    var num = String(c.n).padStart(2,'0');
    btn.innerHTML = '<span class="dot">'+ (state==="passed" ? "" : num) +'</span><span class="label"><span class="t">'+c.title+'</span><span class="k">'+ (state==="soon" ? "準備中" : c.key) +'</span></span>';
    if (state === "soon"){
      btn.setAttribute('aria-disabled','true');
    } else {
      btn.addEventListener('click', function(n){ return function(){ goTo(n); }; }(c.n));
    }
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderQuiz(n){
  var qs = QUIZ[n];
  if (!qs) return "";
  var html = '<div class="quiz" data-chapter="'+n+'">';
  html += '<div class="quiz-head"><h3>小測驗</h3><span class="hint">非必答，檢查一下自己是不是真的懂了</span></div>';
  qs.forEach(function(q, qi){
    html += '<div class="quiz-q" data-qi="'+qi+'" data-correct="'+q.correct+'">';
    html += '<p class="q-text">Q'+(qi+1)+'. '+esc(q.q)+'</p>';
    q.opts.forEach(function(opt, oi){
      html += '<label class="opt"><input type="radio" name="q-'+n+'-'+qi+'" value="'+oi+'"> <span>'+esc(opt)+'</span></label>';
    });
    html += '<div class="q-feedback" hidden></div>';
    html += '<div class="explain" hidden data-text="'+esc(q.explain)+'"></div>';
    html += '</div>';
  });
  html += '<div class="quiz-actions"><button class="btn" data-action="check">檢查答案</button><button class="btn ghost" data-action="retry" hidden>重新測驗</button><span class="quiz-msg" role="status"></span></div>';
  html += '</div>';
  return html;
}

function bindQuiz(root, n){
  var quiz = root.querySelector('.quiz');
  if (!quiz) return;
  var checkBtn = quiz.querySelector('[data-action="check"]');
  var retryBtn = quiz.querySelector('[data-action="retry"]');
  var msg = quiz.querySelector('.quiz-msg');

  checkBtn.addEventListener('click', function(){
    var qs = quiz.querySelectorAll('.quiz-q');
    var allAnswered = true, allCorrect = true;
    qs.forEach(function(qEl){
      var correct = qEl.getAttribute('data-correct');
      var checked = qEl.querySelector('input[type=radio]:checked');
      var fb = qEl.querySelector('.q-feedback');
      var explainText = qEl.querySelector('.explain').getAttribute('data-text');
      if (!checked){ allAnswered = false; return; }
      fb.hidden = false;
      if (checked.value === correct){
        fb.className = "q-feedback correct";
        fb.textContent = "✓ 答對了 — " + explainText;
      } else {
        fb.className = "q-feedback wrong";
        fb.textContent = "✗ 再想想 — " + explainText;
        allCorrect = false;
      }
    });
    if (!allAnswered){
      msg.className = "quiz-msg bad";
      msg.textContent = "還有題目沒作答喔。";
      return;
    }
    if (allCorrect){
      progress[n] = true;
      saveProgress(progress);
      msg.className = "quiz-msg ok celebrate";
      msg.textContent = "全部答對！這章你已經確實理解了。";
      checkBtn.hidden = true;
      renderNav();
    } else {
      msg.className = "quiz-msg bad";
      msg.textContent = "有答錯的題目，看看上面的說明，再試一次。";
      retryBtn.hidden = false;
    }
  });

  retryBtn.addEventListener('click', function(){
    quiz.querySelectorAll('input[type=radio]').forEach(function(r){ r.checked = false; });
    quiz.querySelectorAll('.q-feedback').forEach(function(f){ f.hidden = true; });
    msg.textContent = "";
    checkBtn.hidden = false;
    retryBtn.hidden = true;
  });
}

function soonPanel(c){
  return '<div class="soon-panel"><div class="tag">建置中</div><h4>這一章正在對照 hermes-agent 的原始碼撰寫</h4><p>'+esc(c.dek)+' 這一節需要先拆解真實 repo 的模組（例如 hermes_state*.py、tools/voice_mode.py、gateway/、subagent 相關程式碼），確認檔案路徑與實際行為後才會補上，避免亂編。</p></div>';
}

var BODY = {}; // filled below per chapter

function render(){
  renderNav();
  var c = CH[active-1];
  var root = document.getElementById('content');
  var num = String(c.n).padStart(2,'0');
  var bodyHtml = c.status === "soon" && !BODY[c.n] ? soonPanel(c) : (BODY[c.n] || soonPanel(c));
  var quizHtml = c.status === "soon" ? "" : renderQuiz(c.n);

  var prevDisabled = c.n <= 1 ? 'disabled' : '';
  var nextState = chapterState(c.n+1 <= 17 ? c.n+1 : 17);
  var nextDisabled = (c.n >= 17 || (nextState === 'soon')) ? 'disabled' : '';

  root.innerHTML =
    '<div class="ch-head"><div class="eyebrow"><span class="num">CH.'+num+'</span> HARNESS 拆裝手冊</div>' +
    '<h2>'+esc(c.title)+'</h2><p class="dek">'+esc(c.dek)+'</p></div>' +
    bodyHtml + quizHtml +
    '<div class="chapter-nav">' +
      '<button class="btn ghost" data-nav="prev" '+prevDisabled+'>← 上一章</button>' +
      '<button class="btn ghost" data-nav="next" '+nextDisabled+'>下一章 →</button>' +
    '</div>';

  bindQuiz(root, c.n);
  Array.prototype.forEach.call(root.querySelectorAll('[data-goto]'), function(el){
    el.addEventListener('click', function(){ goTo(parseInt(el.getAttribute('data-goto'), 10)); });
  });
  root.querySelector('[data-nav="prev"]').addEventListener('click', function(){ if(active>1){ active--; render(); window.scrollTo(0,0);} });
  root.querySelector('[data-nav="next"]').addEventListener('click', function(){ if(active<17 && chapterState(active+1)!=='soon'){ active++; render(); window.scrollTo(0,0);} });

  document.getElementById('foot-cur').textContent = num;
}

function goTo(n){
  var state = chapterState(n);
  if (state === 'soon') return;
  active = n;
  render();
  window.scrollTo(0,0);
}

  '<h4>同一個 session 壓縮第二次以後：疊代式更新</h4>' +

  '<p>同一個 <span class="mono">state.db</span> 可能同時被好幾個程式寫入：gateway、CLI，以及 <strong>worktree agent</strong>（用 <span class="mono">hermes --worktree</span> 啟動的 session——它會用 <span class="mono">git worktree add</span> 另外切出一份獨立的工作目錄＋分支，讓這個 agent 在不影響你當前分支的地方單獨改程式碼，但仍然共用同一個 <span class="mono">~/.hermes/state.db</span>）。多個程式搶同一份資料庫檔案的寫入權，做法拆開來看是四件事疊在一起：①連線先設一個<strong>短逾時</strong>（1 秒）——搶不到鎖就快速失敗，不要傻等；②搶鎖失敗就在應用層自己重試，重試間隔加一點<strong>隨機亂數（jitter）</strong>，是為了避免好幾個程式同時醒來又同時再撞在一起（這叫 convoy／驚群問題）——爭用愈久，這個隨機間隔也拉得愈長（從 20–150ms 逐步拉高到 250ms–1s）；③重試不是「試 N 次就放棄」，而是「試到某個時間預算用完就放棄」（一般寫入約 20 秒，逐字稿等關鍵寫入放寬到 60 秒）；④每次交易明確用上面提到的 <span class="mono">BEGIN IMMEDIATE</span> 搶寫鎖，並且每 50 次寫入就做一次 WAL 的 checkpoint（把日誌檔的內容合併回主資料庫檔案，避免日誌檔無限長大）。</p>' +

  '<p>不是——至少不是一般講的「向量嵌入式」RAG。典型 RAG 的做法是：把文字轉成向量（embedding），存進向量資料庫，查詢時也轉成向量，靠向量之間的距離找出「語意相近」的段落，這個過程通常會自動夾在每次生成之前發生。<span class="mono">session_search</span> 完全不是這樣：它是純<strong>關鍵字全文檢索</strong>——查詢字串直接丟給上面的 FTS5 索引做比對，用 SQLite 內建的 <strong>BM25</strong> 演算法排序（一種看關鍵字出現頻率的統計排名，不理解字面以外的意思，比對的是文字，不是語意），還支援布林查詢語法：預設多個詞是 AND 關係，也能寫 <span class="mono">alpha OR beta</span>、用引號做片語精確比對、用 <span class="mono">deploy*</span> 做前綴比對。整個過程<strong>零 embedding、零向量資料庫、零 LLM 呼叫</strong>，而且不是自動觸發的管線——是模型自己判斷「這輪好像需要查一下之前講過什麼」，主動呼叫 <span class="mono">session_search</span> 這個工具才會發生，跟前面自動出現在 prompt 裡的 MEMORY.md／USER.md 完全是不同的觸發方式。</p>' +
  '<p>真正做「向量／語意檢索」的，是第 13 章談的<strong>部分</strong>外部 memory provider——像 Holographic、Mem0、OpenViking、Hindsight、Honcho 都各自有自己的 embedding 或向量比對機制，RetainDB 甚至是「Vector＋BM25＋Rerank」混合搜尋。但那是另一層完全獨立、選用、同時間最多啟用一個的系統，不是 <span class="mono">session_search</span> 在做的事。</p>' +
  '<h4>壓縮後 session 去哪了</h4>' +

    '<text class="dg-mono" x="310" y="140" text-anchor="middle" font-size="10">載入完整 schema</text>' +
    '<text class="dg-mono" x="535" y="140" text-anchor="middle" font-size="10">真正呼叫，等同直接呼叫</text>' +
    '<defs><marker id="arr11" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path class="dg-arrow" d="M0,0 L6,3 L0,6 z"/></marker></defs>' +
  '</svg><div class="cap">看到名字就能跳過①直接②——只有完全不知道有哪些工具時才需要搜尋。</div></div>' +
  '<p>三個橋接工具的參數長這樣：<span class="mono">tool_search(queries: string[])</span>——例如 <span class="mono">queries: ["create github issue", "send slack message"]</span>，每個字串是幾個關鍵字描述一個能力，會平行搜尋、依查詢分組回傳命中的工具名稱；<span class="mono">tool_describe(names: string[])</span>——把 <span class="mono">tool_search</span> 回傳的確切名稱丟進去，換回完整 JSON schema；<span class="mono">tool_call(name: string, arguments: object)</span>——照 schema 填好參數真正呼叫，會走過跟直接列出的工具完全一樣的權限檢查、hook、核准流程。</p>' +
  '<h4>三層退化（tiered disclosure）</h4>' +
  '<div class="table-wrap"><table><tr><th>層級</th><th>觸發條件</th><th>模型看到什麼</th><th>具體例子</th></tr>' +
    '<tr><td>Tier 0</td><td>沒有可延後的 MCP／外掛工具</td><td>全部照舊，直接列出，無橋接</td><td>沒接任何 MCP 伺服器、也沒裝非核心外掛——就只有內建工具，三個橋接工具根本不會出現</td></tr>' +
    '<tr><td>Tier 1</td><td>延後工具的清單塞得進預算</td><td>橋接工具 ＋ 每個延後工具的名稱＋簡短描述（類似 skills 的清單模式）</td><td>接一個中型 MCP 伺服器，例如提供二三十個工具的 GitHub MCP——這些工具的「名稱＋一行描述」全部列出來還在預算內，模型看到的是 3 個橋接工具，外加一份「<span class="mono">create_issue</span> — 建立一個新 issue」這種清單</td></tr>' +
    '<tr><td>Tier 2</td><td>連「只列名稱」都塞不下</td><td>只剩橋接工具 ＋ 每個伺服器一行的摘要，個別工具只能靠搜尋發現</td><td>原始碼註解裡舉的真實案例：Cloudflare 的 MCP 伺服器攤平後有<strong>約 3,300 個工具</strong>，光是把名字全部列出來就要吃掉約 32K token，遠超預算——這時模型只看得到「cloudflare-mcp——3,300 個工具可用」這種一行摘要，要找特定工具必須靠 <span class="mono">tool_search</span> 關鍵字查</td></tr>' +
  '</table></div>' +
  '<p>預算怎麼算：<span class="mono">budget = min( listing_max_tokens, context 視窗 × threshold_pct )</span>，預設 <span class="mono">threshold_pct = 5%</span>、<span class="mono">listing_max_tokens = 4000</span> token（兩者都可調整）——延後工具清單的「名稱＋描述」版本先試算，塞得進這個預算就是 Tier 1；退化成「只列名稱」還是塞不下，才會掉到 Tier 2。</p>' +
  '<p>Tier 1 的「清單」很關鍵：如果完全不給任何線索，模型容易忘記某個能力存在，改用它已知的其他工具硬做，或乾脆宣稱做不到。保留一份輕量清單，讓每個能力至少「知道存在」，只是細節參數延後載入。</p>' +
'</div>';

BODY[12] =
'<div class="section">' +
  '<p>Skills 是 agent 隨選載入的知識文件——不是工具（工具是「能力」），而是「怎麼做一件事的說明書」。跟第 5 章的記憶系統是互補關係：記憶存的是「小而持久的事實」，skill 存的是「長而完整的流程」。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>漸進式揭露：三個層級</h3>' +
  '<div class="table-wrap"><table><tr><th>層級</th><th>怎麼取得</th><th>回傳內容</th><th>成本</th></tr>' +
    '<tr><td>Level 0</td><td>不用呼叫工具——這份索引直接烤進 system prompt，每輪自動出現在模型眼前</td><td>每個 skill 的名稱＋描述＋分類</td><td>約 3k token，一直存在</td></tr>' +
    '<tr><td>Level 1</td><td>主動呼叫 <span class="mono">skill_view(name)</span></td><td>完整 <span class="mono">SKILL.md</span> 內容＋metadata＋一份 <span class="mono">linked_files</span> 清單（列出這個 skill 底下有哪些 references／templates／scripts）</td><td>視 skill 大小，真正要用才載入</td></tr>' +
    '<tr><td>Level 2</td><td>再呼叫一次 <span class="mono">skill_view(name, file_path=...)</span>，路徑抄自上一步回傳的 <span class="mono">linked_files</span></td><td>某一份特定的參考檔案（<span class="mono">references/</span>／<span class="mono">templates/</span>／<span class="mono">scripts/</span> 底下）</td><td>只在需要那份細節時才載入</td></tr>' +
  '</table></div>' +
  '<p>具體例子——假設有個 <span class="mono">pdf-form-filling</span> skill：Level 0 你（透過模型）看到的就是 system prompt 裡一行「<span class="mono">pdf-form-filling</span> — 讀取並填寫 PDF 表單欄位」；模型判斷這輪用得到，呼叫 <span class="mono">skill_view("pdf-form-filling")</span> 進到 Level 1，拿到完整流程說明，回傳裡的 <span class="mono">linked_files</span> 可能列著 <span class="mono">references/field-types.md</span>、<span class="mono">scripts/fill_form.py</span>；只有真的碰到某種特殊欄位類型看不懂時，才會再呼叫 <span class="mono">skill_view("pdf-form-filling", file_path="references/field-types.md")</span> 進到 Level 2，把那份細節文件單獨載進來。</p>' +
  '<p>還有一個 <span class="mono">skills_list()</span> 工具，容易被誤會是「第一步一定要呼叫的入口」——其實不是：Level 0 索引本來就自動在 system prompt 裡，不需要主動查。<span class="mono">skills_list()</span> 是備用查詢工具，用在索引可能不夠新、或想按分類篩選的時候，不是「list → view → reference」這個順序裡必經的第一步；真正每次都會發生的，是「（被動看到 Level 0）→ 主動 <span class="mono">skill_view</span> 進 Level 1 →（有需要才）進 Level 2」。</p>' +
  '<p>這讓一個 skill 可以龐大而不昂貴：像 <span class="mono">/learn</span> 把一整本書變成 skill 時，不會硬塞成一個巨大檔案，而是產出一份精簡的 <span class="mono">SKILL.md</span>（核心心智模型＋索引），每個章節各自一份 <span class="mono">references/</span> 檔案，查詢成本只跟「答案需要的那一小塊」成正比，不跟整本書的大小成正比。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>三層優先權：專案先於個人，個人先於外部</h3>' +
  '<div class="table-wrap"><table><tr><th>層級</th><th>位置</th><th>誰能修改</th></tr>' +
    '<tr><td>Project（最高優先權）</td><td class="mono">&lt;repo&gt;/.hermes/skills/</td><td>Curator 永不觸碰；agent 新建的 skill 永遠寫到 local，不會寫進這裡</td></tr>' +
    '<tr><td>Local（唯一寫入點）</td><td class="mono">~/.hermes/skills/</td><td>agent 可自由建立／修改／刪除</td></tr>' +
    '<tr><td>External dirs</td><td>設定檔指定的額外目錄</td><td>如果該目錄本身可寫，agent 更新一樣會改到那裡</td></tr>' +
  '</table></div>' +
  '<p>Project skill 雖然優先權最高，卻也是<strong>最不被信任</strong>的一層——因為它跟著 <span class="mono">git pull</span> 一起變動，內容可能被別人動過手腳。所以每次載入前都會重新跑一次安全掃描（scan-time quarantine），一旦掃到「危險」等級的內容（例如藏著要求外洩憑證的指令），直接從索引裡隱藏，連名稱都叫不出來，而不是載入後才提示風險。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>Skills Hub：多來源的套件管理器</h3>' +
  '<p>Skills 有一個像套件管理器一樣的生態：可以從官方目錄、第三方市集、甚至任意 GitHub repo 安裝，安裝前都會過同一套安全掃描：</p>' +
  '<div class="table-wrap"><table><tr><th>來源</th><th>信任等級</th></tr>' +
    '<tr><td>bundled（隨 Hermes 附帶）</td><td>永遠信任</td></tr>' +
    '<tr><td>official（repo 內建的選用 skill）</td><td>內建信任，不顯示第三方警告</td></tr>' +
    '<tr><td>trusted（如 openai/skills、anthropics/skills）</td><td>比一般社群來源寬鬆的政策</td></tr>' +
    '<tr><td>community（skills.sh、自訂 GitHub repo、大多數市集）</td><td>非危險等級的發現可以用 <span class="mono">--force</span> 覆蓋；「danger」等級無法覆蓋</td></tr>' +
  '</table></div>' +
'</div>' +
'<div class="section">' +
  '<h3>Curator：防止 skill 庫無限增生的背景維護者</h3>' +
  '<p>每次 agent 解決一個新問題並把做法存成 skill，<span class="mono">~/.hermes/skills/</span> 就多一個檔案。沒有維護機制的話，最後會累積出大量狹窄、彼此重疊的近似 skill，污染索引又浪費 token。Curator 正是為此而生的背景維護程序，分兩個階段：</p>' +
  '<div class="table-wrap"><table><tr><th>階段</th><th>行為</th><th>成本</th></tr>' +
    '<tr><td>自動轉換（決定性，預設開）</td><td>閒置 30 天 → stale；閒置 90 天 → archived（移到 <span class="mono">.archive/</span>，可還原，從不真正刪除）</td><td>零，不呼叫模型</td></tr>' +
    '<tr><td>LLM 整併（consolidate，預設關）</td><td>審視有重疊的 skill，決定保留／修補／合併成「傘狀」skill／歸檔</td><td>一次完整審查通常要跑 50–100 次 aux-model 呼叫</td></tr>' +
  '</table></div>' +
  '<h4>什麼時候會跑，什麼時候會觸發 LLM 整併</h4>' +
  '<p>Curator 不是排程工具（cron），而是掛在 <span class="mono">hermes</span> 的 CLI 啟動和 gateway 啟動路徑上的一個檢查點——每次啟動都會問一次「該不該跑」：條件是①距離上次執行超過 <span class="mono">interval_hours</span>（預設 <strong>168 小時／7 天</strong>），②機器至少閒置 <span class="mono">min_idle_hours</span>（預設 <strong>2 小時</strong>）。兩個條件都滿足，才會 fork 一個 <span class="mono">AIAgent</span> 在背景默默跑一次審查——這也是為什麼它的成本影響幾乎感覺不到：不常跑、挑你沒在用的時候跑。你也可以用 <span class="mono">hermes curator run</span> 手動立即觸發，不用等排程。</p>' +
  '<p>但即使自動觸發了，預設也<strong>只做左邊那個免費的「自動轉換」</strong>——真正花 token 的 LLM 整併，還需要額外滿足<span class="mono">curator.consolidate: true</span> 這個設定（或手動下 <span class="mono">hermes curator run --consolidate</span>），兩者缺一都不會觸發 LLM 呼叫。也就是說：預設安裝下，LLM 整併這個階段實際上<strong>永遠不會自動發生</strong>，除非你自己選擇打開。</p>' +
  '<p>整併審查用的模型跟第 4 章壓縮摘要是同一套解析機制——只是換一個任務名稱 <span class="mono">auxiliary.curator.model</span>（沒設就退回目前 provider 的 <span class="mono">default_aux_model</span>，再沒有就退回主模型），細節見第 4 章的說明。</p>' +
  '<p>Curator 只管「agent-created」的 skill——判定條件很窄：不在 bundled 清單、不在 hub 安裝清單、而且 <span class="mono">.usage.json</span> 裡明確標記由背景自我改進審查建立。你當場請 agent 建立的 skill，或手動寫的 <span class="mono">SKILL.md</span>，一律被視為「你的」東西，Curator 不會主動碰，除非你用 <span class="mono">curator adopt</span> 明確交出去。</p>' +
  '<h4>兩種保護：pin 與備份</h4>' +
  '<p><strong>Pin</strong> 保護一個 skill 不被刪除——擋住 Curator 的自動歸檔，也擋住 agent 的 <span class="mono">skill_manage(delete)</span>，但<em>不擋</em> patch／edit，因為你通常還是希望內容能被持續改進。<strong>備份</strong> 則是另一層安全網：每次真正的 Curator 執行前，會先把整個 skills 目錄打包快照；如果某次執行影響到你不想變動的內容，<span class="mono">hermes curator rollback</span> 一鍵整批復原；更精細的單筆操作還有一份逐筆的稽核帳本（ledger），連單一次修改都能單獨回滾。</p>' +
'</div>';

BODY[13] =
'<div class="section">' +
  '<p><span class="mono">回顧第 5 章</span>：MEMORY.md／USER.md（精選、有上限、自動注入）與 session_search（無限、隨選查詢）是「永遠存在」的兩層。這一章談的是三種<em>選用的擴充</em>：換一個更強大的外部記憶引擎、讓專案自己攜帶規則、以及在訊息裡直接用 <span class="mono">@</span> 把檔案內容塞進對話。</p>' +

'<div class="section">' +
  '<h3>External Memory Providers：疊加，不是取代</h3>' +
  '<p>Hermes 內建 8 種外部記憶 provider 插件，同一時間<strong>只能啟用一個</strong>，但它跟內建記憶永遠並存——啟用後，Hermes 會自動把 provider 的上下文注入 system prompt、在每輪對話前背景預抓相關記憶、每輪結束後同步對話內容、並鏡射內建記憶的寫入。</p>' +
  '<div class="table-wrap"><table><tr><th>Provider</th><th>儲存位置</th><th>特色能力</th></tr>' +

    '<tr><td>ByteRover</td><td>本地優先／雲端同步</td><td>壓縮前搶救——context 壓縮丟掉細節前先萃取重點</td></tr>' +
    '<tr><td>Supermemory</td><td>雲端／自架</td><td>語意長期記憶＋session 結束時寫入 Supermemory graph</td></tr>' +
  '</table></div>' +
'</div>' +
'<div class="section">' +
  '<h3>Honcho 深入：兩層情境注入</h3>' +
  '<p>Honcho 值得多花篇幅，因為它示範了一個成熟外部記憶 provider 的完整設計：</p>' +
  '<ul>' +
    '<li><strong>基礎層（base）</strong>——session 摘要＋使用者側寫＋雙方的「peer card」，由 <span class="mono">contextCadence</span> 控制多久刷新一次（純 API 呼叫，不含 LLM 推理）。</li>' +
    '<li><strong>辯證層（dialectic）</strong>——LLM 綜合推理出「這個使用者現在真正需要什麼」，由 <span class="mono">dialecticCadence</span> 控制觸發頻率，還能設定 <span class="mono">dialecticDepth</span>（1–3 次連續推理：初判 → 自我審查 → 調和矛盾）。</li>' +
  '</ul>' +
  '<p>這兩個旋鈕彼此正交：可以「每輪都刷新基礎資訊，但深度推理每 5 輪才跑一次」——新鮮度和成本可以分開調整。系統啟動時還會在背景搶跑一次辯證推理（prewarm），避免使用者第一句話就撞上一次同步、有延遲的 LLM 呼叫。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>Context Files：專案怎麼「自我介紹」</h3>' +
  '<p>Hermes 會自動探索並載入幾種專案情境檔案，決定「這個 agent 現在該表現得像什麼樣子」：</p>' +
  '<div class="table-wrap"><table><tr><th>檔案</th><th>用途</th><th>探索範圍</th></tr>' +
    '<tr><td class="mono">.hermes.md</td><td>專案指示（最高優先權）</td><td>走到 git root</td></tr>' +
    '<tr><td class="mono">AGENTS.md</td><td>專案結構、慣例、架構</td><td>啟動目錄＋逐步探索子目錄</td></tr>' +

  '<p>同一個 session 只會選<strong>一種</strong>專案情境類型（<span class="mono">.hermes.md</span> → <span class="mono">AGENTS.md</span> → <span class="mono">CLAUDE.md</span> → <span class="mono">.cursorrules</span>，第一個命中就用它），但 <span class="mono">AGENTS.md</span> 本身允許「整條鏈」合併：從 git root 到工作目錄，途中每一層的 <span class="mono">AGENTS.md</span> 都會載入，越深層的排在越後面，天然取得較高優先權。</p>' +
  '<h4>漸進式子目錄發現</h4>' +

    '<tr><td>壓縮摘要提示</td><td>對話接近門檻時，背景輔助模型</td><td>固定模板（Goal／Completed Actions／Errors &amp; Fixes...），首次生成 vs 疊代更新走不同提示</td><td>第 4 章</td></tr>' +
    '<tr><td>Subagent 系統提示</td><td>每個被委派的子 Agent，從零組裝</td><td>YOUR TASK＋CONTEXT＋WORKSPACE PATH，重新載入工作目錄的 AGENTS.md，跳過 SOUL.md</td><td>第 7 章、本章</td></tr>' +
    '<tr><td>MoA reference／aggregator 提示</td><td>Mixture of Agents 的每一次呼叫</td><td>reference 套固定顧問角色提示；aggregator 看得到全部 reference 的回答再匯總</td><td>第 14 章</td></tr>' +
    '<tr><td>Curator 審查提示</td><td>背景維護 skill 庫，consolidate 開啟時</td><td>一份很長的規則手冊——目標、禁止事項、工作方法，附即時的候選 skill 清單</td><td>本章</td></tr>' +
    '<tr><td>Session 命名提示</td><td>每個新 session 的第一則使用者訊息</td><td>固定規則＋幾組好／壞範例，JSON Schema 強制輸出格式</td><td>本章</td></tr>' +
  '</table></div>' +
  '<p>共通點：除了主系統提示是「模型面向、每輪都看得到」之外，其餘全部是<strong>背景輔助任務</strong>——模型本身完全不知道這些提示詞的存在，它們是 harness 另外拿一次 LLM 呼叫、餵一份專門設計的提示詞、拿到一個結構化結果後，悄悄把結果用在別的地方（存進摘要、寫進 session 標題、決定要不要合併某個 skill）。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>近看：Subagent 的系統提示長什麼樣</h3>' +
  '<p>第 7 章講過子 Agent「只拿得到 goal 和 context 兩個字串」，這裡把 <span class="mono">_build_child_system_prompt()</span>（<span class="mono">tools/delegate_tool.py</span>）實際組出來的內容攤開：</p>' +
  '<div class="table-wrap"><table><tr><th>區塊</th><th>內容</th></tr>' +
    '<tr><td>開場白</td><td>固定一句「你是一個專注在單一委派任務上的 subagent」</td></tr>' +
    '<tr><td>YOUR TASK</td><td>父 Agent 傳進來的 <span class="mono">goal</span> 字串，逐字放進去</td></tr>' +
    '<tr><td>CONTEXT（選用）</td><td>父 Agent 傳進來的 <span class="mono">context</span> 字串，有給才附上</td></tr>' +
    '<tr><td>WORKSPACE PATH（選用）</td><td>工作目錄路徑，附上使用規範；<strong>並且</strong>重新跑一次跟主 Agent 一樣的 AGENTS.md／CLAUDE.md 探索邏輯，把找到的內容整段附進來——因為子 Agent 建構時 <span class="mono">skip_context_files=True</span>，不這樣做它會完全不知道專案的規範</td></tr>' +
    '<tr><td>（刻意不含）SOUL.md</td><td>原始碼註解明講：身份屬於父 Agent，子 Agent 不需要，也不該有</td></tr>' +
  '</table></div>' +
  '<p>對照第 15 章的主系統提示堆疊：主系統提示是「固定的八層，內容隨對話進行變動」；子 Agent 的系統提示則是「每次委派都從零現組一份，跟父 Agent 當下的系統提示完全獨立」——兩者共用同一個組裝函式家族（<span class="mono">build_context_files_prompt</span> 這類 helper），但產出的是兩份不同壽命、不同用途的文字。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>近看：Curator 的審查提示——規則多到不像「提示」</h3>' +
  '<p>跟其他模板比，Curator 的審查提示（<span class="mono">CURATOR_REVIEW_PROMPT</span>，<span class="mono">agent/curator.py</span>）明顯更長、更像一份規章，而不是幾句引導語。原因很直接：這是唯一一個<strong>真的會改動你東西</strong>的背景任務（歸檔、合併 skill），所以原始碼作者選擇把容易出錯的判斷邊界直接寫死成規則，而不是信任模型的常識：</p>' +
  '<ul>' +
    '<li>「不准刪除任何 skill，最重的動作是歸檔（可還原）」</li>' +
    '<li>「pinned=yes 的 skill 完全跳過，不准碰」</li>' +
    '<li>「use_count=0 不是刪除的理由——這只代表『還沒被用過』，不代表『沒用』；要同時滿足『30 天以上』且『內容確實過時或已被別處吸收』才能歸檔」</li>' +
    '<li>「不要用『每個 skill 觸發條件不同』當作拒絕合併的理由——真正的判準是『一個人類維護者會不會把這些寫成一個 skill 底下的幾個小節』」</li>' +
  '</ul>' +
  '<p>這是一個值得記住的設計原則：<strong>提示詞的『抽象程度』要跟它的『風險程度』成反比</strong>——風險越低（例如寫個 session 標題，寫錯了也不過是標題不好聽），提示詞可以越簡短、留更多空間讓模型自由判斷；風險越高（會真的刪東西、動使用者資產），提示詞就該把邊界案例一條條寫死，不留模型自由心證的空間。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>近看：Session 命名——最短，但機關最多的一份</h3>' +
  '<p>Session 命名的提示詞（<span class="mono">agent/title_generator.py</span>）反而是這幾份裡最短的，但示範了兩個獨立的「讓輸出可靠」的手法：</p>' +
  '<ul>' +
    '<li><strong>結構化輸出</strong>——用 <span class="mono">response_format: json_schema</span>（<span class="mono">{"title": "..."}</span>，<span class="mono">additionalProperties: false</span>）強制回應形狀，直接從格式上排除「模型把這句話當成使用者問題來回答」這種真實觀察到的失敗模式（原始碼註解裡點名的失敗案例：標題被生成成 <span class="mono">"&lt;title&gt;...&lt;/title&gt;"</span> 或 <span class="mono">"User: Yep, that&#39;s the catch —"</span>）。</li>' +
    '<li><strong>Few-shot 對照範例</strong>——不只講規則（3–7 個字、句首大寫、不要句尾標點），還直接給「好例子／太模糊／太長」的具體對照，讓模型校準「多短算短」而不是自己猜。</li>' +
  '</ul>' +
  '<p>語言規則用一個佔位字串 <span class="mono">__LANGUAGE_RULE__</span> 在組裝時字串替換——這是這份模板裡唯一動態的部分，其餘規則跟範例整份都是寫死的常數。</p>' +
'</div>' +
'<div class="section">' +
  '<h3>共通模式：這些模板背後其實共用同一條路</h3>' +
  '<p>雖然內容天差地遠，這幾份模板在「怎麼被呼叫」這件事上其實走的是同一套機制，不是各自發明一套：</p>' +
  '<ul>' +
    '<li><strong>同一套輔助模型解析鏈</strong>——第 4 章講過的三層解析（任務專屬設定 → provider 的 <span class="mono">default_aux_model</span> → 主模型）不是壓縮專屬的，Curator 審查、session 命名全部都走同一個 <span class="mono">agent/auxiliary_client.py</span>，只是各自登記不同的任務名稱（<span class="mono">auxiliary.compression.model</span>／<span class="mono">auxiliary.curator.model</span>／<span class="mono">auxiliary.title_generation.model</span>）。</li>' +
    '<li><strong>風險越高，規則寫得越死</strong>——上面 Curator vs 命名提示的對照已經示範過這個光譜。</li>' +
    '<li><strong>結構化輸出優先於「請簡短回答」這種軟性請求</strong>——只要輸出會被程式碼直接解析（標題、摘要的固定段落標題），就傾向用 schema 或明確格式規則硬性約束，不依賴模型自己拿捏語氣。</li>' +
  '</ul>' +
  '<p>把這些模板放在一起看的意義是：它們不是各自獨立、需要分開記憶的機制，而是同一套「harness 怎麼跟輔助 LLM 溝通」設計哲學，套用在不同任務上的具體實例。</p>' +
'</div>';

render();
