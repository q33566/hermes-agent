<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hermes-agent Harness 拆解簡報</title>
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E7ECF1; --surface-3:#DCE3EA;
  --ink:#151E27; --ink-dim:#57646F; --border:#D2DAE1;
  --accent:#1B6E8C; --accent-strong:#0F4F66; --accent-soft:#DCEEF4;
  --shadow: 0 1px 2px rgba(21,30,39,.06), 0 8px 24px -12px rgba(21,30,39,.18);
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--bg); color:var(--ink);}
body{font-family:'IBM Plex Sans','Noto Sans TC',ui-sans-serif,system-ui,sans-serif; line-height:1.6;}
h1,h2,h3{margin:0 0 .3em; text-wrap:balance;}
p{margin:0 0 .8em;}
::selection{background:var(--accent-soft); color:var(--accent-strong);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
.mono,code{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em;}

.screen{display:none;}
.screen.active{display:block;}

/* ---------- slide screen ---------- */
#slide{min-height:100vh; display:flex; flex-direction:column;}
.slide-topbar{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow); padding:10px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.outlineBtn{all:unset; cursor:pointer; font-weight:600; font-size:.85rem; padding:7px 15px; border-radius:999px;}
.outlineBtn{color:var(--ink); background:var(--surface-2); border:1px solid var(--border);}
.outlineBtn:hover{border-color:var(--accent); color:var(--accent-strong);}
.crumb{font-size:.85rem; color:var(--ink-dim);}
.crumb b{color:var(--accent-strong);}
.progress{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-dim);}
.progress-bar{height:3px; background:var(--surface-2);}
.progress-bar i{display:block; height:100%; background:var(--accent); transition:width .2s ease;}

.slide-main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px 60px; cursor:pointer;}
.slide-main button, .slide-main a{cursor:pointer;}
.slide-bullets, .slide-title, figcaption{cursor:pointer;}
.slide-card{max-width:820px; width:100%;}

.cover-block{text-align:center; padding:40px 10px;}
.cover-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.85rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700;}
.cover-title{font-size:2.6rem; color:var(--accent-strong); margin-top:18px; line-height:1.3;}
.cover-subtitle{color:var(--ink-dim); font-size:1.1rem; margin-top:16px; max-width:52ch; margin-left:auto; margin-right:auto;}
.slide-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:10px;}
.slide-eyebrow .src{background:var(--surface-2); color:var(--ink-dim); padding:1px 9px; border-radius:999px; font-weight:600; letter-spacing:0; text-transform:none;}
.slide-title{font-size:1.5rem; color:var(--accent-strong); margin-top:10px; line-height:1.4;}
.slide-bullets{list-style:none; margin:22px 0 0; padding:0; display:flex; flex-direction:column; gap:14px;}
.slide-bullets li{position:relative; padding-left:26px; font-size:1.12rem; color:var(--ink); max-width:70ch;}
.slide-bullets li::before{content:"—"; position:absolute; left:0; color:var(--accent);}

.diagram{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin:22px 0 4px; overflow-x:auto; box-shadow:var(--shadow);}
.diagram svg{display:block; margin:0 auto;}
.diagram .dg-box{fill:var(--surface-2); stroke:var(--border); stroke-width:1.5;}
.diagram .dg-box.accent{fill:var(--accent-soft); stroke:var(--accent);}
.diagram .dg-line{stroke:var(--ink-dim); stroke-width:1.5; fill:none;}
.diagram .dg-text{fill:var(--ink); font-size:12.5px;}
.diagram .dg-mono{fill:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:10.5px;}
.diagram table{width:100%; border-collapse:collapse; font-size:.85rem;}
.diagram table th,.diagram table td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top;}
.diagram table th{background:var(--surface-2); font-weight:700; color:var(--ink-dim); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em;}
.diagram table td:first-child{font-weight:700; color:var(--accent-strong); white-space:nowrap;}
.diagram table tr:last-child td{border-bottom:none;}
figcaption{margin-top:8px; font-size:.82rem; color:var(--ink-dim); text-align:center;}

.impl-toggle{all:unset; cursor:pointer; margin-top:22px; display:inline-flex; align-items:center; gap:8px; font-size:.88rem; font-weight:600; color:var(--accent-strong); background:var(--accent-soft); border:1px solid var(--accent); padding:8px 16px; border-radius:999px;}
.impl-toggle:hover{filter:brightness(1.05);}
.impl-toggle .arw{transition:transform .15s ease;}
.impl-toggle.open .arw{transform:rotate(90deg);}
.impl-body{display:none; margin-top:14px; padding:16px 18px; background:var(--surface-2); border:1px dashed var(--border); border-radius:10px;}
.impl-body.open{display:block;}
.impl-body .impl-label{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); font-weight:700; margin-bottom:8px;}
.impl-body ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
.impl-body li{position:relative; padding-left:20px; font-size:.92rem; color:var(--ink);}
.impl-body li::before{content:"▸"; position:absolute; left:0; color:var(--accent);}
.impl-body code, .impl-body .mono{background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:0 4px;}

.rel-links{margin-top:26px; display:flex; flex-wrap:wrap; gap:8px;}
.rel-links .rl-label{font-size:.8rem; color:var(--ink-dim); width:100%; margin-bottom:2px;}
.rel-link{all:unset; cursor:pointer; font-size:.86rem; color:var(--accent-strong); background:var(--accent-soft); border:1px solid var(--accent); padding:7px 14px; border-radius:999px;}
.rel-link:hover{filter:brightness(1.05);}
.rel-link .tag{font-size:.72rem; color:var(--ink-dim); margin-left:6px;}

.fsBtn{all:unset; cursor:pointer; font-weight:600; font-size:.85rem; padding:7px 15px; border-radius:999px; color:var(--ink); background:var(--surface-2); border:1px solid var(--border);}
.fsBtn:hover{border-color:var(--accent); color:var(--accent-strong);}

/* ---------- outline side drawer (while viewing a slide) ---------- */
#drawerBackdrop{position:fixed; inset:0; background:rgba(21,30,39,.35); z-index:20; display:none;}
#drawerBackdrop.open{display:block;}
#drawer{position:fixed; top:0; right:-360px; width:340px; max-width:88vw; height:100vh; background:var(--surface); box-shadow:-8px 0 24px rgba(21,30,39,.18); z-index:21; transition:right .2s ease; overflow-y:auto; padding:20px 18px;}
#drawer.open{right:0;}
#drawer h3{font-size:1rem; color:var(--accent-strong); margin-bottom:14px;}
.drawer-sec{margin-bottom:14px;}
.drawer-sec-title{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px;}
.drawer-sec ul{list-style:none; margin:0; padding:0;}
.drawer-sec button{all:unset; box-sizing:border-box; width:100%; cursor:pointer; padding:6px 8px; border-radius:6px; font-size:.86rem; color:var(--ink-dim);}
.drawer-sec button:hover{background:var(--accent-soft); color:var(--accent-strong);}
.drawer-sec button.current{background:var(--accent-strong); color:#fff; font-weight:600;}
</style>
</head>

-2">三層揭露</button></li><li><button data-jump="skills-3" data-slide="skills-3">儲存優先權</button></li><li><button data-jump="skills-4" data-slide="skills-4">Skills Hub</button></li><li><button data-jump="skills-5" data-slide="skills-5">Curator</button></li><li><button data-jump="skills-6" data-slide="skills-6">Plugin</button></li></ul></div><div class="drawer-sec"><div class="drawer-sec-title">Multi-Agent</div><ul><li><button data-jump="multiagent-0" data-slide="multiagent-0">兩種機制</button></li><li><button data-jump="multiagent-1" data-slide="multiagent-1">委派動機</button></li><li><button data-jump="multiagent-2" data-slide="multiagent-2">隔離邊界</button></li><li><button data-jump="multiagent-3" data-slide="multiagent-3">實作本質</button></li><li><button data-jump="multiagent-4" data-slide="multiagent-4">背景執行</button></li><li><button data-jump="multiagent-5" data-slide="multiagent-5">Mixture of Agents</button></li><li><button data-jump="multiagent-6" data-slide="multiagent-6">Reference／Aggregator</button></li></ul></div><div class="drawer-sec"><div class="drawer-sec-title">Identity</div><ul><li><button data-jump="identity-5" data-slide="identity-5">SOUL.md</button></li><li><button data-jump="identity-6" data-slide="identity-6">AGENTS.md</button></li><li><button data-jump="identity-8" data-slide="identity-8">md 檔案總覽</button></li></ul></div><div class="drawer-sec"><div class="drawer-sec-title">Guidance／Prompts</div><ul><li><button data-jump="guidance-1" data-slide="guidance-1">多套背景模板</button></li><li><button data-jump="guidance-2" data-slide="guidance-2">八層堆疊</button></li><li><button data-jump="guidance-3" data-slide="guidance-3">設計原則</button></li><li><button data-jump="guidance-5" data-slide="guidance-5">總結</button></li></ul></div>

"55\" rx=\"8\"/><text class=\"dg-text\" x=\"80\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">Tools</text><text class=\"dg-mono\" x=\"80\" y=\"46\" text-anchor=\"middle\" font-size=\"9\">不會動手→行動力</text><rect class=\"dg-box\" x=\"160\" y=\"10\" width=\"140\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">Multi-Agent</text><text class=\"dg-mono\" x=\"230\" y=\"46\" text-anchor=\"middle\" font-size=\"9\">context 塞爆／需平行</text><rect class=\"dg-box\" x=\"310\" y=\"10\" width=\"140\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"380\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">Identity</text><text class=\"dg-mono\" x=\"380\" y=\"46\" text-anchor=\"middle\" font-size=\"9\">不知道自己是誰→身份設定</text><rect class=\"dg-box\" x=\"10\" y=\"75\" width=\"140\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"80\" y=\"96\" text-anchor=\"middle\" font-size=\"12\">Skills</text><text class=\"dg-mono\" x=\"80\" y=\"111\" text-anchor=\"middle\" font-size=\"9\">不懂特定流程→補上</text><rect class=\"dg-box\" x=\"160\" y=\"75\" width=\"140\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"96\" text-anchor=\"middle\" font-size=\"12\">Memory</text><text class=\"dg-mono\" x=\"230\" y=\"111\" text-anchor=\"middle\" font-size=\"9\">不會記得→跨session</text><rect class=\"dg-box accent\" x=\"310\" y=\"75\" width=\"140\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"380\" y=\"96\" text-anchor=\"middle\" font-size=\"12\">Guidance/Prompts</text><text class=\"dg-mono\" x=\"380\" y=\"111\" text-anchor=\"middle\" font-size=\"9\">不知怎麼用好前五者</text><rect class=\"dg-box accent\" x=\"10\" y=\"145\" width=\"440\" height=\"35\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"166\" text-anchor=\"middle\" font-size=\"12\">Context 維護貫穿全部六者，不是第七個節點</text></svg><figcaption>每個模組補上模型的一種天生缺口，Context 維護貫穿全部。</figcaption></figure></div>", "links": [], "src": "", "impl": [], "cover": false, "subtitle": ""}], "core": [{"id": "core-1", "title": "什麼是 Harness", "bullets": ["模型 API 無狀態，且只能輸出文字——不會記得歷史，也不會真的動手。", "迴圈補上這個缺口：組裝歷史 → 呼叫模型 → 執行工具 → 結果併入歷史 → 循環。", "接下來六節，依序補上模型還缺的每一種能力：Tools、Context 維護、Memory、Skills、Multi-Agent、Identity、Guidance/Prompts。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 620 320\" role=\"img\" aria-label=\"Harness 是包住模型的一層外殼：Loop 是內部邏輯，往外分派給 Tools、Memory、Context 維護等多種能力模組\"><defs><marker id=\"arrow1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect x=\"15\" y=\"15\" width=\"590\" height=\"290\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"6 5\" rx=\"16\" opacity=\"0.6\"/><text class=\"dg-text\" x=\"40\" y=\"40\" font-size=\"13\">Harness</text><rect class=\"dg-box accent\" x=\"230\" y=\"55\" width=\"160\" height=\"70\" rx=\"8\"/><text class=\"dg-text\" x=\"310\" y=\"94\" text-anchor=\"middle\" font-size=\"12\">Model</text><rect class=\"dg-box\" x=\"230\" y=\"160\" width=\"160\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"310\" y=\"189\" text-anchor=\"middle\" font-size=\"12\">Loop</text><path class=\"dg-line\" d=\"M270 160 L270 125\" marker-end=\"url(#arrow1)\"/><path class=\"dg-line\" d=\"M350 125 L350 160\" marker-end=\"url(#arrow1)\"/><rect class=\"dg-box\" x=\"40\" y=\"250\" width=\"110\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"95\" y=\"274\" text-anchor=\"middle\" font-size=\"12\">Tools</text><rect class=\"dg-box\" x=\"170\" y=\"250\" width=\"110\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"225\" y=\"274\" text-anchor=\"middle\" font-size=\"12\">Memory</text><rect class=\"dg-box\" x=\"300\" y=\"250\" width=\"110\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"355\" y=\"274\" text-anchor=\"middle\" font-size=\"12\">Context 維護</text><rect class=\"dg-box\" x=\"430\" y=\"250\" width=\"160\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"510\" y=\"264\" text-anchor=\"middle\" font-size=\"12\">其他能力</text><text class=\"dg-mono\" x=\"510\" y=\"279\" text-anchor=\"middle\" font-size=\"9\">Skills／Multi-Agent 等</text><path class=\"dg-line\" d=\"M250 210 L95 250\" marker-end=\"url(#arrow1)\"/><path class=\"dg-line\" d=\"M283 210 L225 250\" marker-end=\"url(#arrow1)\"/><path class=\"dg-line\" d=\"M317 210 L355 250\" marker-end=\"url(#arrow1)\"/><path class=\"dg-line\" d=\"M350 210 L510 250\" marker-end=\"url(#arrow1)\"/></svg><figcaption>Loop 只是 Harness 眾多分派對象之一——工具呼叫不等於 Harness 全貌。</figcaption></figure></div>", "links": [["tools-1", "下一節：Tools 呼叫協定"]], "src": "CH.01／CH.02", "impl": ["業界沒有統一官方命名：常見說法是 agent loop，或沿用學術上的 ReAct 框架（Yao et al., 2022）；hermes-agent 內部函式為 run_conversation()（agent/conversation_loop.py），原始碼註解稱之為「the agent conversation loop」，同樣沒有專屬品牌名稱。", "接上工具後，assistant 端內容永遠是「區塊陣列」（text／tool_use 混合），不是純字串。"], "cover": false, "subtitle": ""}], "tools": [{"id": "tools-1", "title": "呼叫協定", "bullets": ["模型只能請求呼叫工具，執行永遠由 Harness 負責——工具定義是一份 JSON schema，模型看到後最多只能說「我想用這個」。", "平行呼叫要合併回傳：模型一次可能請求多個工具，全部執行完才合併成單一訊息送回；失敗附加 is_error: true，不能靜默丟棄。", "執行前先做風險分級：唯讀查詢直接放行；有副作用操作標記確認；破壞性操作預設要求人工核准。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"工具呼叫協定\"><defs><marker id=\"arrow2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><text class=\"dg-text\" x=\"60\" y=\"20\" font-size=\"11\">Model</text><text class=\"dg-text\" x=\"360\" y=\"20\" font-size=\"11\">Harness</text><line x1=\"60\" y1=\"28\" x2=\"60\" y2=\"115\" class=\"dg-line\"/><line x1=\"360\" y1=\"28\" x2=\"360\" y2=\"115\" class=\"dg-line\"/><path class=\"dg-line\" d=\"M60 48 L360 48\" marker-end=\"url(#arrow2)\"/><text class=\"dg-mono\" x=\"75\" y=\"42\" font-size=\"10\">①請求 tool_use</text><rect class=\"dg-box accent\" x=\"320\" y=\"62\" width=\"80\" height=\"26\" rx=\"8\"/><text class=\"dg-text\" x=\"360\" y=\"79\" text-anchor=\"middle\" font-size=\"12\">②本地執行</text><path class=\"dg-line\" d=\"M360 100 L60 100\" marker-end=\"url(#arrow2)\"/><text class=\"dg-mono\" x=\"75\" y=\"116\" font-size=\"10\">③回傳 tool_result</text></svg><figcaption>模型只能請求；Harness 才真正執行並回傳結果。</figcaption></figure></div>", "links": [], "src": "CH.03", "impl": ["stop_reason 除了 tool_use／end_turn，還有 max_tokens（回應被截斷，可能含未寫完的 tool_use，不能照做）。", "此處命名（tool_use／tool_result）是 Anthropic Messages API 的形狀；其他供應商可能用獨立的 tool 角色＋tool_calls 欄位承載同樣資訊。", "hermes-agent 用執行緒池同時發動多個工具呼叫，結果依模型原呼叫順序重新排列後才回傳。", "風險比對是一組已知危險模式的規則列表，不是模型自行判斷；命中就先卡住，不直接執行——例如危險 shell 指令。"], "cover": false, "subtitle": ""}, {"id": "tools-5", "title": "分類與啟用", "bullets": ["八大類：Web／Terminal＆Files／Browser／Media／Agent 編排／記憶／自動化／整合，各自補一種行動缺口。", "工具裝多了會直接吃掉 context：不是全部常駐，可以依場景只啟用需要的分類——但就算只開必要分類，數量還是可能多到成為問題，這是下一頁 Tool Search 要處理的事。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"八大工具分類\"><defs><marker id=\"arrow4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"5\" y=\"5\" width=\"140\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"75\" y=\"20\" text-anchor=\"middle\" font-size=\"12\">Web</text><text class=\"dg-mono\" x=\"75\" y=\"35\" text-anchor=\"middle\" font-size=\"9\">web_search／web_extract</text><rect class=\"dg-box\" x=\"155\" y=\"5\" width=\"150\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"20\" text-anchor=\"middle\" font-size=\"12\">Terminal＆Files</text><text class=\"dg-mono\" x=\"230\" y=\"35\" text-anchor=\"middle\" font-size=\"9\">terminal／read_file／patch</text><rect class=\"dg-box\" x=\"315\" y=\"5\" width=\"140\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"385\" y=\"20\" text-anchor=\"middle\" font-size=\"12\">Browser</text><text class=\"dg-mono\" x=\"385\" y=\"35\" text-anchor=\"middle\" font-size=\"9\">browser_navigate</text><rect class=\"dg-box\" x=\"5\" y=\"55\" width=\"140\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"75\" y=\"70\" text-anchor=\"middle\" font-size=\"12\">Media</text><text class=\"dg-mono\" x=\"75\" y=\"85\" text-anchor=\"middle\" font-size=\"9\">vision／image／TTS</text><rect class=\"dg-box\" x=\"155\" y=\"55\" width=\"150\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"70\" text-anchor=\"middle\" font-size=\"12\">Agent 編排</text><text class=\"dg-mono\" x=\"230\" y=\"85\" text-anchor=\"middle\" font-size=\"9\">todo／delegate_task</text><rect class=\"dg-box\" x=\"315\" y=\"55\" width=\"140\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"385\" y=\"70\" text-anchor=\"middle\" font-size=\"12\">記憶</text><text class=\"dg-mono\" x=\"385\" y=\"85\" text-anchor=\"middle\" font-size=\"9\">memory／session_search</text><rect class=\"dg-box\" x=\"5\" y=\"105\" width=\"140\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"75\" y=\"120\" text-anchor=\"middle\" font-size=\"12\">自動化</text><text class=\"dg-mono\" x=\"75\" y=\"135\" text-anchor=\"middle\" font-size=\"9\">cronjob</text><rect class=\"dg-box\" x=\"155\" y=\"105\" width=\"150\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"120\" text-anchor=\"middle\" font-size=\"12\">整合</text><text class=\"dg-mono\" x=\"230\" y=\"135\" text-anchor=\"middle\" font-size=\"9\">MCP／Home Assistant</text></svg><figcaption>可依平台啟用子集（toolset），非全部常駐。</figcaption></figure></div>", "links": [], "src": "CH.11", "impl": ["分類定義在 toolsets.py，可用 `hermes chat --toolsets \"web,terminal\"` 或互動式的 `hermes tools` 指定啟用哪些分類。", "核心工具清單（terminal／read_file／memory 等）寫死在 toolsets._HERMES_CORE_TOOLS，不受平台開關影響。"], "cover": false, "subtitle": ""}, {"id": "tools-7", "title": "Tool Search", "bullets": ["假設你有 3,300 個工具，光是完整列出清單就要吃掉約 32K token（模型讀寫文字的計量單位），還沒開始做事就先塞爆一大塊 context。", "三段式：tool_search → tool_describe → tool_call；核心工具不受影響，恆常列出。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 175\" role=\"img\" aria-label=\"Tool Search 範例：先搜尋，再取得完整定義，才呼叫\"><defs><marker id=\"arrow6\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"15\" width=\"120\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"80\" y=\"27\" text-anchor=\"middle\" font-size=\"12\">tool_search</text><text class=\"dg-mono\" x=\"80\" y=\"42\" text-anchor=\"middle\" font-size=\"9\">關鍵字找候選</text><rect class=\"dg-box\" x=\"170\" y=\"15\" width=\"120\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"27\" text-anchor=\"middle\" font-size=\"12\">tool_describe</text><text class=\"dg-mono\" x=\"230\" y=\"42\" text-anchor=\"middle\" font-size=\"9\">換完整 schema</text><rect class=\"dg-box accent\" x=\"320\" y=\"15\" width=\"120\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"380\" y=\"27\" text-anchor=\"middle\" font-size=\"12\">tool_call</text><text class=\"dg-mono\" x=\"380\" y=\"42\" text-anchor=\"middle\" font-size=\"9\">真正呼叫</text><path class=\"dg-line\" d=\"M140 33 L170 33\" marker-end=\"url(#arrow6)\"/><path class=\"dg-line\" d=\"M290 33 L320 33\" marker-end=\"url(#arrow6)\"/><text class=\"dg-text\" x=\"20\" y=\"72\" font-size=\"11\">範例：</text><text class=\"dg-mono\" x=\"20\" y=\"90\" font-size=\"9\">tool_search(queries=[\"create github issue\", \"send slack message\"])</text><text class=\"dg-mono\" x=\"20\" y=\"106\" font-size=\"9\">→ 命中：github.create_issue、slack.send_message</text><text class=\"dg-mono\" x=\"20\" y=\"130\" font-size=\"9\">tool_describe(names=[\"github.create_issue\"])</text><text class=\"dg-mono\" x=\"20\" y=\"146\" font-size=\"9\">→ 回傳完整 JSON schema（參數、型別、必填欄位）</text></svg><figcaption>核心工具不受影響，恆常列出；此機制只延後其餘工具的細節，不影響能不能用。</figcaption></figure></div>", "links": [["skills-2", "同一設計模式：Skills"]], "src": "CH.11", "impl": ["預算公式：min(listing_max_tokens=4000, context 視窗 × 5%)，兩者皆可調整。", "核心工具豁免清單寫死在 toolsets._HERMES_CORE_TOOLS，不受此機制影響。"], "cover": false, "subtitle": ""}, {"id": "tools-8", "title": "LSP（Language Server Protocol）", "bullets": ["write_file／patch 後，先語法檢查，通過才做語意檢查——抓叫錯函式、型別不合這類語法合法但邏輯錯的問題。", "只回報本次編輯新增的診斷；語言伺服器缺失時靜默降級，不阻斷寫入。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"LSP：語意層檢查在語法檢查之後\"><defs><marker id=\"arrow7\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"10\" width=\"130\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"75\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">write_file／patch</text><path class=\"dg-line\" d=\"M75 44 L75 70\" marker-end=\"url(#arrow7)\"/><rect class=\"dg-box\" x=\"10\" y=\"70\" width=\"130\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"75\" y=\"81\" text-anchor=\"middle\" font-size=\"12\">語法檢查</text><text class=\"dg-mono\" x=\"75\" y=\"96\" text-anchor=\"middle\" font-size=\"9\">ast.parse</text><path class=\"dg-line\" d=\"M140 87 L180 87\" marker-end=\"url(#arrow7)\"/><text class=\"dg-mono\" x=\"148\" y=\"80\" font-size=\"10\">通過</text><rect class=\"dg-box accent\" x=\"180\" y=\"70\" width=\"140\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"250\" y=\"91\" text-anchor=\"middle\" font-size=\"12\">語言伺服器診斷</text><path class=\"dg-line\" d=\"M320 87 L340 87\" marker-end=\"url(#arrow7)\"/><rect class=\"dg-box\" x=\"340\" y=\"60\" width=\"110\" height=\"54\" rx=\"8\"/><text class=\"dg-text\" x=\"395\" y=\"81\" text-anchor=\"middle\" font-size=\"12\">僅回報</text><text class=\"dg-mono\" x=\"395\" y=\"96\" text-anchor=\"middle\" font-size=\"9\">本次新增的診斷</text></svg><figcaption>語言伺服器缺失時靜默降級為空，絕不阻斷 write_file／patch。</figcaption></figure></div>", "links": [], "src": "CH.16", "impl": ["語言伺服器閒置 600 秒（預設）自動關閉釋放資源，下次用到時懶啟動（lazy-spawn）重開。", "僅在偵測到 git repo 時才啟動；診斷比對「編輯前基準線」與「編輯後結果」，只留新增的部分。"], "cover": false, "subtitle": ""}, {"id": "tools-closing", "title": "小結", "bullets": ["工具定義、風險規則、Tool Search 的候選清單……全部都要送進模型看得到的那段文字裡，而這段文字不會自動變小。", "下一節要處理的，就是這個代價本身：內容一直塞，最後會發生什麼事？"], "diagram": "", "links": [], "src": "CH.11", "impl": [], "cover": false, "subtitle": ""}], "context": [{"id": "context-1", "title": "總覽", "bullets": ["成因：模型無狀態（見核心迴圈），每輪需重送完整歷史，文字量只會愈滾愈大，不會自己變小。", "「Context」（context window）就是模型一次能讀進去的文字上限；快取（caching）不縮減內容，壓縮（compaction）才會真的變小——而壓縮本身是先便宜清除、才貴的摘要，不是兩個可以分開開的獨立策略。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 120\" role=\"img\" aria-label=\"Context 維護：兩種對策\"><defs><marker id=\"arrow8\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"30\" width=\"180\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"51\" text-anchor=\"middle\" font-size=\"12\">快取 caching</text><text class=\"dg-mono\" x=\"110\" y=\"66\" text-anchor=\"middle\" font-size=\"9\">不縮減，只是不用重算</text><rect class=\"dg-box accent\" x=\"260\" y=\"30\" width=\"180\" height=\"55\" rx=\"8\"/><text class=\"dg-text\" x=\"350\" y=\"51\" text-anchor=\"middle\" font-size=\"12\">壓縮 compaction</text><text class=\"dg-mono\" x=\"350\" y=\"66\" text-anchor=\"middle\" font-size=\"9\">先清除，才貴的摘要</text></svg><figcaption>快取不縮減內容；壓縮才會真的變小，而且先從便宜的清除開始，才進到貴的摘要。</figcaption></figure></div>", "links": [], "src": "CH.04", "impl": [], "cover": false, "subtitle": ""}, {"id": "context-2", "title": "快取", "bullets": ["穩定內容（system prompt——送給模型的角色設定與規則文字——跟工具定義）放前面，易變內容放後面才能持續命中。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 110\" role=\"img\" aria-label=\"快取：前綴比對，一個 byte 就全毀\"><defs><marker id=\"arrow9\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box accent\" x=\"10\" y=\"30\" width=\"300\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"160\" y=\"54\" text-anchor=\"middle\" font-size=\"12\">system prompt ＋ 工具定義（穩定前綴）</text><rect class=\"dg-box\" x=\"320\" y=\"30\" width=\"130\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"385\" y=\"54\" text-anchor=\"middle\" font-size=\"12\">易變內容</text><path class=\"dg-line\" d=\"M300 50 L320 50\" marker-end=\"url(#arrow9)\"/><text class=\"dg-mono\" x=\"300\" y=\"20\" font-size=\"10\">此點之後才允許變動</text><text class=\"dg-mono\" x=\"160\" y=\"90\" font-size=\"11\" text-anchor=\"middle\">前綴任一 byte 改變 → 快取自該點起全部失效</text></svg><figcaption>穩定內容放前面、易變內容放後面，才能持續命中。</figcaption></figure></div>", "links": [["identity-6", "應用案例：AGENTS.md 漸進式發現"]], "src": "CH.04", "impl": ["hermes-agent 對 Anthropic 模型的快取邊界策略：system prompt ＋最近 3 則訊息的滾動視窗，最多 4 個快取斷點，可選 5 分鐘或 1 小時存留時間。"], "cover": false, "subtitle": ""}, {"id": "context-4", "title": "壓縮", "bullets": ["修剪（trimming）：規則式移除窗口外舊工具結果，開頭固定訊息永不變動——移除時 tool_use／tool_result 必須成對處理，落單會讓下一次呼叫直接失效。", "摘要（summarization）：另外呼叫一個較小、較便宜的模型，依固定模板產出結構化摘要，憑證一律遮罩為 [REDACTED]。", "二次以後為疊代式：新摘要完整取代舊摘要，非拼接。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"壓縮＝修剪＋摘要，共四步\"><defs><marker id=\"arrow11\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"5\" y=\"45\" width=\"105\" height=\"44\" rx=\"8\"/><text class=\"dg-text\" x=\"57\" y=\"61\" text-anchor=\"middle\" font-size=\"12\">①修剪</text><text class=\"dg-mono\" x=\"57\" y=\"76\" text-anchor=\"middle\" font-size=\"9\">規則式，不呼叫模型</text><rect class=\"dg-box\" x=\"120\" y=\"45\" width=\"105\" height=\"44\" rx=\"8\"/><text class=\"dg-text\" x=\"172\" y=\"61\" text-anchor=\"middle\" font-size=\"12\">②劃定邊界</text><text class=\"dg-mono\" x=\"172\" y=\"76\" text-anchor=\"middle\" font-size=\"9\">開頭＋近期窗口</text><rect class=\"dg-box accent\" x=\"235\" y=\"45\" width=\"105\" height=\"44\" rx=\"8\"/><text class=\"dg-text\" x=\"287\" y=\"61\" text-anchor=\"middle\" font-size=\"12\">③產生摘要</text><text class=\"dg-mono\" x=\"287\" y=\"76\" text-anchor=\"middle\" font-size= size=\"9\" text-anchor=\"middle\">Gateway 安全網（粗估）</text><path class=\"dg-line\" d=\"M418 44 L418 78\" marker-end=\"url(#arrow12)\"/><rect class=\"dg-box\" x=\"10\" y=\"78\" width=\"480\" height=\"24\" rx=\"8\"/><text class=\"dg-text\" x=\"250\" y=\"94\" text-anchor=\"middle\" font-size=\"12\"></text><text class=\"dg-text\" x=\"10\" y=\"118\" font-size=\"10\">0%</text><text class=\"dg-text\" x=\"490\" y=\"118\" font-size=\"10\" text-anchor=\"end\">100%</text><text class=\"dg-mono\" x=\"250\" y=\"150\" font-size=\"10\" text-anchor=\"middle\">context window ＜512K 時，50% 門檻自動提高到 75%</text></svg><figcaption>數字愈大代表愈晚介入；50% 精細可調，85% 粗略保底。</figcaption></figure></div>", "links": [], "src": "CH.04", "impl": ["Gateway 端常數位於 gateway/run.py；Agent 端 512K／75% 門檻常數位於 agent/context_compressor.py。"], "cover": false, "subtitle": ""}], "memory": [{"id": "memory-1", "title": "兩種記憶", "bullets": ["對話歷史：受 context 管理影響，可被摘要或清除——這是上一節的範圍。", "跨 session 記憶：本節主題，指需長期保留的名稱、偏好、關鍵決策，就算歷史被清掉也不能丟。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 120\" role=\"img\" aria-label=\"兩種「記住」完全不同\"><defs><marker id=\"arrow13\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"30\" width=\"200\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"49\" text-anchor=\"middle\" font-size=\"12\">對話歷史 messages</text><text class=\"dg-mono\" x=\"110\" y=\"64\" text-anchor=\"middle\" font-size=\"9\">受 context 管理影響，可被摘要／清除</text><rect class=\"dg-box accent\" x=\"250\" y=\"30\" width=\"200\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"350\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">跨 session 記憶</text><text class=\"dg-mono\" x=\"350\" y=\"72\" font-size=\"9\" text-anchor=\"middle\">名稱・偏好・關鍵決策，需長期保留</text></svg><figcaption>對話歷史會被摘要清除；跨 session 記憶才是本節主題。</figcaption></figure></div>", "links": [], "src": "CH.05", "impl": [], "cover": false, "subtitle": ""}, {"id": "memory-3", "title": "MEMORY.md／USER.md", "bullets": ["兩份獨立檔案：MEMORY.md（agent 自己的筆記）與 USER.md（關於使用者的側寫）——各自容量小、有字元數上限（非 token），每輪自動注入 system prompt。", "怎麼被使用：session 啟動時載入一次，之後整個 session 期間是穩定快照（snapshot），不會中途重讀。", "怎麼被更新：不需要使用者下指令——累積一定輪次後，agent 自己觸發背景審查，寫回這兩份檔案。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 210\" role=\"img\" aria-label=\"雙軌並行：常駐快照＋背景審查\"><defs><marker id=\"arrow15\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"10\" width=\"180\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"32\" text-anchor=\"middle\" font-size=\"12\">Session 開始</text><path class=\"dg-line\" d=\"M110 46 L110 70\" marker-end=\"url(#arrow15)\"/><rect class=\"dg-box\" x=\"20\" y=\"70\" width=\"180\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"84\" text-anchor=\"middle\" font-size=\"12\">讀入 MEMORY.md／USER.md</text><text class=\"dg-mono\" x=\"110\" y=\"99\" text-anchor=\"middle\" font-size=\"9\">一次性快照，寫入 system prompt</text><rect class=\"dg-box\" x=\"260\" y=\"10\" width=\"180\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"350\" y=\"32\" text-anchor=\"middle\" font-size=\"12\">使用者輪次計數 = 10</text><path class=\"dg-line\" d=\"M350 46 L350 70\" marker-end=\"url(#arrow15)\"/><rect class=\"dg-box accent\" x=\"260\" y=\"70\" width=\"180\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"350\" y=\"84\" text-anchor=\"middle\" font-size=\"12\">fork 審查子 Agent</text><text class=\"dg-mono\" x=\"350\" y=\"99\" text-anchor=\"middle\" font-size=\"9\">工具白名單限縮，不碰主對話快取</text><path class=\"dg-line\" d=\"M350 110 L240 150\" marker-end=\"url(#arrow15)\"/><text class=\"dg-mono\" x=\"270\" y=\"135\" font-size=\"10\">寫回</text><rect class=\"dg-box accent\" x=\"20\" y=\"150\" width=\"420\" height=\"45\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"166\" text-anchor=\"middle\" font-size=\"12\">寫回 MEMORY.md／USER.md</text><text class=\"dg-mono\" x=\"230\" y=\"181\" text-anchor=\"middle\" font-size=\"9\">跟左側同一組檔案（各自獨立），下次 session（或本次壓縮）才生效</text></svg><figcaption>背景審查寫回的內容，要等下次 session（或本次觸發壓縮）才會被讀到。</figcaption></figure></div>", "links": [["skills-5", "同類機制：Skills 的 Curator"], ["multiagent-1", "背景程序的實作原理：Multi-Agent"]], "src": "CH.05", "impl": ["實際上限：MEMORY.md 約 2,200 字元、USER.md 約 1,375 字元（字元數硬限制，非 token）。", "memory 工具只有 add／replace／remove 三種操作，以子字串比對，沒有 read 動作。", "審查觸發門檻：memory.nudge_interval 預設 10 個使用者輪次；這個背景程序其實是 fork 出的一個工具白名單（whitelist）限縮的子 Agent，完全不碰主對話的 prompt 快取。"], "cover": false, "subtitle": ""}, {"id": "memory-4", "title": "state.db", "bullets": ["完整對話歷史存在單一 SQLite 資料庫 state.db，CLI／Gateway／worktree agent 共用同一份。", "怎麼被更新：多個程式同時寫同一份檔案——短逾時快速失敗＋隨機退避重試＋搶鎖機制；每 50 次寫入做一次 checkpoint。", "怎麼被查找：session_search 用 FTS5 全文索引 ＋ BM25 排序，零 embedding、零向量資料庫——模型主動呼叫才觸發，不是自動注入。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 170\" role=\"img\" aria-label=\"state.db：單一 SQLite，WAL 模式仲裁多寫入者\"><defs><marker id=\"arrow16\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"10\" width=\"110\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"65\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">CLI</text><rect class=\"dg-box\" x=\"175\" y=\"10\" width=\"110\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">Gateway</text><rect class=\"dg-box\" x=\"340\" y=\"10\" width=\"110\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"395\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">worktree agent</text><path class=\"dg-line\" d=\"M65 44 L230 90\" marker-end=\"url(#arrow16)\"/><path class=\"dg-line\" d=\"M230 44 L230 90\" marker-end=\"url(#arrow16)\"/><path class=\"dg-line\" d=\"M395 44 L230 90\" marker-end=\"url(#arrow16)\"/><rect class=\"dg-box accent\" x=\"160\" y=\"90\" width=\"140\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"119\" text-anchor=\"middle\" font-size=\"12\">state.db（WAL）</text><text class=\"dg-mono\" x=\"230\" y=\"155\" font-size=\"10\" text-anchor=\"middle\">每 50 次寫入做一次 checkpoint，合併日誌回主檔案</text></svg><figcaption>短逾時快速失敗＋隨機退避重試＋BEGIN IMMEDIATE 搶鎖。</figcaption></figure></div>", "links": [], "src": "CH.06", "impl": ["連線逾時 1 秒；重試退避 20–150ms，爭用愈久拉高到 250ms–1s；一般寫入時間預算 20 秒，逐字稿等關鍵寫入放寬到 60 秒。", "批次寫入函式 SessionDB.append_messages_batch()，一次 turn 內多個檢查點觸發，不等到 session 結束才存檔。", "三張不同拆字法（tokenizer）的 FTS 表：messages_fts（空白分詞）／_fts_trigram（三字元重疊切法）／_fts_cjk（中日韓專用）。", "語意檢索（非關鍵字）由部分外部 provider 另外提供，session_search 本身零向量資料庫。"], "cover": false, "subtitle": ""}, {"id": "memory-6", "title": "外部 Provider", "bullets": ["8 種可選 provider，同時僅能啟用一個；啟用後 MEMORY.md／USER.md／state.db 全部照常運作，並非替代關係。", "小結：記憶解決的是「記得事實」；但模型不只需要記得事，還需要知道「這件事具體怎麼做」——這是下一節 Skills 的主題。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 140\" role=\"img\" aria-label=\"外部記憶 Provider：疊加，不取代\"><defs><marker id=\"arrow18\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"10\" width=\"180\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"30\" text-anchor=\"middle\" font-size=\"12\">MEMORY.md／USER.md</text><rect class=\"dg-box\" x=\"20\" y=\"49\" width=\"180\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"69\" text-anchor=\"middle\" font-size=\"12\">state.db</text><rect class=\"dg-box accent\" x=\"20\" y=\"88\" width=\"180\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"108\" text-anchor=\"middle\" font-size=\"12\">外部 provider（8 選 1）</text><path class=\"dg-line\" d=\"M200 26 L300 58\" marker-end=\"url(#arrow18)\"/><path class=\"dg-line\" d=\"M200 65 L300 68\" marker-end=\"url(#arrow18)\"/><path class=\"dg-line\" d=\"M200 104 L300 78\" marker-end=\"url(#arrow18)\"/><rect class=\"dg-box\" x=\"300\" y=\"38\" width=\"150\" height=\"58\" rx=\"8\"/><text class=\"dg-text\" x=\"375\" y=\"61\" text-anchor=\"middle\" font-size=\"12\">同時餵入</text><text class=\"dg-mono\" x=\"375\" y=\"76\" text-anchor=\"middle\" font-size=\"9\">system prompt／context</text></svg><figcaption>啟用後三層同時運作，不會停用內建機制。</figcaption></figure></div>", "links": [], "src": "CH.13", "impl": ["8 種內建 provider：Honcho／OpenViking／Mem0／Hindsight／Holographic／RetainDB／ByteRover／Supermemory（plugins/memory/ 目錄）。"], "cover": false, "subtitle": ""}], "skills": [{"id": "skills-1", "title": "Memory vs Skill", "bullets": ["一句話講得完的事實 → Memory；需要走多步驟操作的流程 → Skill。", "記憶：小而持久。Skill：長而完整，可以很龐大而不昂貴。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 140\" role=\"img\" aria-label=\"用內容形態判斷該存 Memory 還是 Skill\"><defs><marker id=\"arrow19\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"15\" width=\"190\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"115\" y=\"34\" text-anchor=\"middle\" font-size=\"12\">Memory</text><text class=\"dg-mono\" x=\"115\" y=\"49\" text-anchor=\"middle\" font-size=\"9\">小而持久的事實</text><rect class=\"dg-box accent\" x=\"250\" y=\"15\" width=\"190\" height=\"50\" rx=\"8\"/><text class=\"dg-text\" x=\"345\" y=\"34\" text-anchor=\"middle\" font-size=\"12\">Skill</text><text class=\"dg-mono\" x=\"345\" y=\"49\" text-anchor=\"middle\" font-size=\"9\">長而完整的流程</text><text class=\"dg-mono\" x=\"230\" y=\"100\" font-size=\"11\" text-anchor=\"middle\">判準：一句話 → Memory；多步驟流程 → Skill</text></svg><figcaption>一句話講得完 → Memory；需要走多步驟操作 → Skill。</figcaption></figure></div>", "links": [], "src": "CH.12", "impl": ["Skill 落地為一份 SKILL.md（核心心智模型＋索引），大型 skill 可搭配 references/ 底下的細節檔案。"], "cover": false, "subtitle": ""}, {"id": "skills-2", "title": "三層揭露", "bullets": ["Level 0：索引常駐 system prompt。Level 1：取得完整內容。", "Level 2：取得特定參考檔案，僅在需要細節時載入。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"Skills 三層漸進式揭露\"><defs><marker id=\"arrow20\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"20\" width=\"130\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"85\" y=\"35\" text-anchor=\"middle\" font-size=\"12\">Level 0 索引</text><text class=\"dg-mono\" x=\"85\" y=\"50\" text-anchor=\"middle\" font-size=\"9\">名稱／描述／分類</text><rect class=\"dg-box\" x=\"20\" y=\"80\" width=\"130\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"85\" y=\"95\" text-anchor=\"middle\" font-size=\"12\">Level 1 完整內容</text><text class=\"dg-mono\" x=\"85\" y=\"110\" text-anchor=\"middle\" font-size=\"9\">skill_view(name)</text><rect class=\"dg-box accent\" x=\"290\" y=\"80\" width=\"150\" height=\"42\" rx=\"8\"/><text class=\"dg-text\" x=\"365\" y=\"95\" text-anchor=\"middle\" font-size=\"12\">Level 2 參考檔案</text><text class=\"dg-mono\" x=\"365\" y=\"110\" text-anchor=\"middle\" font-size=\"9\">file_path 指定</text><path class=\"dg-line\" d=\"M85 62 L85 80\" marker-end=\"url(#arrow20)\"/><path class=\"dg-line\" d=\"M150 101 L290 101\" marker-end=\"url(#arrow20)\"/></svg><figcaption>Level 0 為常駐成本；Level 1／2 為按需成本，非全部載入。</figcaption></figure></div>", "links": [["tools-7", "同一設計模式：Tools 的 Tool Search"]], "src": "CH.12", "impl": ["對應函式：skill_view(name) 取 Level 1；skill_view(name, file_path=...) 取 Level 2（tools/skills_tool.py）。", "Level 0 索引是被動烤進 system prompt，不是靠模型主動呼叫 skills_list() 才出現。"], "cover": false, "subtitle": ""}, {"id": "skills-3", "title": "儲存優先權", "bullets": ["Project：優先權最高、信任度最低，需明確授權，每次載入強制安檢。", "Local：背景 Curator 唯一可自動寫入層級；使用者可直接請 agent 修改任何來源的 skill。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"Skill 儲存三層優先權\"><defs><marker id=\"arrow21\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"10\" width=\"300\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"170\" y=\"20\" text-anchor=\"middle\" font-size=\"12\">Project</text><text class=\"dg-mono\" x=\"170\" y=\"35\" text-anchor=\"middle\" font-size=\"9\">優先權最高、最不受信任，需明確授權</text><rect class=\"dg-box\" x=\"20\" y=\"49\" width=\"300\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"170\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">Local</text><text class=\"dg-mono\" x=\"170\" y=\"74\" text-anchor=\"middle\" font-size=\"9\">背景 Curator 唯一可自動寫入層級</text><rect class=\"dg-box\" x=\"20\" y=\"88\" width=\"300\" height=\"32\" rx=\"8\"/><text class=\"dg-text\" x=\"170\" y=\"98\" text-anchor=\"middle\" font-size=\"12\">External</text><text class=\"dg-mono\" x=\"170\" y=\"113\" text-anchor=\"middle\" font-size=\"9\">設定檔指定的額外目錄</text></svg><figcaption>優先權與信任度成反比：Project 最高權卻最不受信任。</figcaption></figure></div>", "links": [], "src": "CH.12", "impl": ["Project 層需要使用者明確執行 `hermes skills trust` 授權才會被信任並載入。"], "cover": false, "subtitle": ""}, {"id": "skills-4", "title": "Skills Hub", "bullets": ["信任等級：bundled／official／trusted／community 依序遞減。", "danger 等級掃描結果無法用 --force 強制覆蓋。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"Skills Hub：安裝前統一安全掃描\"><defs><marker id=\"arrow22\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"10\" width=\"100\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"60\" y=\"21\" text-anchor=\"middle\" font-size=\"12\">bundled</text><text class=\"dg-mono\" x=\"60\" y=\"36\" text-anchor=\"middle\" font-size=\"9\">永遠信任</text><rect class=\"dg-box\" x=\"120\" y=\"10\" width=\"100\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"170\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">official</text><rect class=\"dg-box\" x=\"230\" y=\"10\" width=\"100\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"280\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">trusted</text><rect class=\"dg-box\" x=\"340\" y=\"10\" width=\"110\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"395\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">community</text><path class=\"dg-line\" d=\"M230 44 L230 80\" marker-end=\"url(#arrow22)\"/><rect class=\"dg-box accent\" x=\"140\" y=\"80\" width=\"180\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"102\" text-anchor=\"middle\" font-size=\"12\">安裝前安全掃描</text></svg><figcaption>danger 等級掃描結果無法強制覆蓋。</figcaption></figure></div>", "links": [], "src": "CH.12", "impl": [], "cover": false, "subtitle": ""}, {"id": "skills-5", "title": "Curator", "bullets": ["自動轉換：零 LLM 呼叫，純規則式——每個 skill 閒置 30 天 → stale，90 天 → archived（可還原，從不真刪）。", "LLM 整併：預設關閉，需額外設定 curator.consolidate: true 才會跑——單次審查約 50–100 次輔助模型呼叫。", "兩者共同前提：Curator 本身要先被觸發——距上次執行 > 7 天（interval_hours 預設 168 小時），且機器閒置 > 2 小時（min_idle_hours），才會在 CLI／Gateway 啟動時檢查一次。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 170\" role=\"img\" aria-label=\"Curator：免費自動轉換 vs 付費 LLM 整併\"><defs><marker id=\"arrow23\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"15\" width=\"200\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"29\" text-anchor=\"middle\" font-size=\"12\">閒置 30 天 → stale</text><text class=\"dg-mono\" x=\"110\" y=\"44\" text-anchor=\"middle\" font-size=\"9\">規則式，無 LLM 呼叫</text><rect class=\"dg-box\" x=\"10\" y=\"63\" width=\"200\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"110\" y=\"77\" text-anchor=\"middle\" font-size=\"12\">閒置 90 天 → archived</text><text class=\"dg-mono\" x=\"110\" y=\"92\" text-anchor=\"middle\" font-size=\"9\">可還原，從不真刪</text><rect class=\"dg-box accent\" x=\"250\" y=\"15\" width=\"200\" height=\"88\" rx=\"8\"/><text class=\"dg-text\" x=\"350\" y=\"53\" text-anchor=\"middle\" font-size=\"12\">LLM 整併（預設關閉）</text><text class=\"dg-mono\" x=\"350\" y=\"68\" text-anchor=\"middle\" font-size=\"9\">50–100 次輔助模型呼叫／次</text></svg><figcaption>兩條件同時滿足才觸發檢查：距上次 > 7 天 且 閒置 > 2 小時。</figcaption></figure></div>", "links": [["memory-3", "同類機制：Memory 的背景自我審查"]], "src": "CH.12", "impl": [], "cover": false, "subtitle": ""}, {"id": "skills-6", "title": "Plugin", "bullets": ["四種類型：一般 plugin／記憶 provider／context engine／model provider，都是程式碼層擴充，不是知識文件。", "第三方 plugin 預設全部停用，提權需在 manifest 宣告並取得一次性使用者確認——這是同意層，不是沙箱，信任來源才是真防線。", "小結：到這裡，單一 Agent 能補的能力已經差不多了；但有些任務單一 Agent 天生做不完——這是下一節 Multi-Agent 的主題。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 120\" role=\"img\" aria-label=\"Plugin 權限：宣告＋一次性確認，非沙箱\"><defs><marker id=\"arrow24\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"35\" width=\"140\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"80\" y=\"49\" text-anchor=\"middle\" font-size=\"12\">Plugin manifest</text><text class=\"dg-mono\" x=\"80\" y=\"64\" text-anchor=\"middle\" font-size=\"9\">宣告所需權限</text><path class=\"dg-line\" d=\"M150 55 L220 55\" marker-end=\"url(#arrow24)\"/><rect class=\"dg-box\" x=\"220\" y=\"35\" width=\"120\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"280\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">使用者一次性確認</text><path class=\"dg-line\" d=\"M340 55 L370 55\" marker-end=\"url(#arrow24)\"/><rect class=\"dg-box accent\" x=\"370\" y=\"35\" width=\"80\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"410\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">授權生效</text></svg><figcaption>同進程執行；只安裝信任來源才是真正防線。</figcaption></figure></div>", "links": [], "src": "CH.15", "impl": ["記憶 provider 與 context engine 屬於「exclusive」類型：同時只能有一個生效。"], "cover": false, "subtitle": ""}], "multiagent": [{"id": "multiagent-0", "title": "兩種機制", "bullets": ["委派（delegation）：把工作切開，分給獨立的子 Agent 各自完成——每個子 Agent 有自己完整、跟父層隔離的 context 跟工具權限，等於另開一個完整的迷你任務。", "Mixture of Agents（MoA）：不是另開 agent，是同一輪對話裡先問過幾個模型的意見（這些「顧問」沒有自己的 context、沒有工具權限，只是看一眼同一份對話），最後由唯一一個 Aggregator 綜合意見、真正動手。", "接下來先講委派，最後講 MoA。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"委派 vs MoA：切開工作 vs 問過多個意見\"><defs><marker id=\"arrow26\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"25\" width=\"190\" height=\"80\" rx=\"8\"/><text class=\"dg-text\" x=\"115\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">委派 delegation</text><text class=\"dg-mono\" x=\"115\" y=\"74\" text-anchor=\"middle\" font-size=\"9\">切開工作，各自獨立 context 跑</text><rect class=\"dg-box accent\" x=\"250\" y=\"25\" width=\"190\" height=\"80\" rx=\"8\"/><text class=\"dg-text\" x=\"345\" y=\"59\" text-anchor=\"middle\" font-size=\"12\">Mixture of Agents</text><text class=\"dg-mono\" x=\"345\" y=\"74\" text-anchor=\"middle\" font-size=\"9\">同一份工作，多個意見後一人動手</text></svg><figcaption>委派是切開工作、各自獨立跑；MoA 是同一份工作、問過多個意見、只有一人動手。</figcaption></figure></div>", "links": [], "src": "", "impl": [], "cover": false, "subtitle": ""}, {"id": "multiagent-1", "title": "委派動機", "bullets": ["兩種情況該委派：子任務彼此獨立、可以同時進行——單一 Agent 只能一件事做完才做下一件，天生無法平行。", "或者：子任務推理量大，全部塞進主線對話會讓 context 迅速爆滿、推理跟著變混亂。", "解法：委派（delegation）——讓子 Agent 在自己乾淨的 context 裡把髒活做完，只把結論帶回主線；多個子任務一次派工，就能真正平行處理。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 150\" role=\"img\" aria-label=\"委派：子 Agent 於獨立 context 執行\"><defs><marker id=\"arrow25\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"45\" width=\"120\" height=\"55\" rx=\"8\"/>< t class=\"dg-box accent\" x=\"10\" y=\"90\" width=\"150\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"85\" y=\"111\" text-anchor=\"middle\" font-size=\"12\">goal ／ context 字串</text><path class=\"dg-line\" d=\"M160 107 L300 107\" marker-end=\"url(#arrow27)\"/><rect class=\"dg-box\" x=\"10\" y=\"130\" width=\"150\" height=\"20\" rx=\"8\"/><text class=\"dg-text\" x=\"85\" y=\"144\" text-anchor=\"middle\" font-size=\"12\">（例外）AGENTS.md</text><path class=\"dg-line\" d=\"M160 140 L300 140\" marker-end=\"url(#arrow27)\"/><rect class=\"dg-box\" x=\"300\" y=\"60\" width=\"150\" height=\"90\" rx=\"8\"/><text class=\"dg-text\" x=\"375\" y=\"109\" text-anchor=\"middle\" font-size=\"12\">子 Agent 系統提示</text></svg><figcaption>唯一例外：工作目錄下的 AGENTS.md 會被嵌入子 Agent 系統提示。</figcaption></figure></div>", "links": [["identity-6", "這份專案規則檔是什麼：Identity"]], "src": "CH.07", "impl": ["隔離參數：skip_context_files=True、skip_memory=True、platform=\"subagent\"，並用 parent_session_id 追蹤家系。", "這份專案規則檔，就是後面 Identity 一節會細談的 AGENTS.md。"], "cover": false, "subtitle": ""}, {"id": "multiagent-3", "title": "實作本質", "bullets": ["換一份系統提示、限縮工具清單，跑在同進程的另一條執行緒（thread pool）。", "不是另開行程，也不是特殊架構。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"子 Agent＝同一 AIAgent 類別的另一個實例\"><defs><marker id=\"arrow28\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box accent\" x=\"150\" y=\"10\" width=\"160\" height=\"34\" rx=\"8\"/><text class=\"dg-text\" x=\"230\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">AIAgent 類別</text><path class=\"dg-line\" d=\"M200 44 L80 80\" marker-end=\"url(#arrow28)\"/><path class=\"dg-line\" d=\"M280 44 L380 80\" marker-end=\"url(#arrow28)\"/><rect class=\"dg-box\" x=\"10\" y=\"80\" width=\"150\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"85\" y=\"94\" text-anchor=\"middle\" font-size=\"12\">父 Agent 實例</text><text class=\"dg-mono\" x=\"85\" y=\"109\" text-anchor=\"middle\" font-size=\"9\">主執行緒</text><rect class=\"dg-box\" x=\"300\" y=\"80\" width=\"150\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"375\" y=\"94\" text-anchor=\"middle\" font-size=\"12\">子 Agent 實例</text><text class=\"dg-mono\" x=\"375\" y=\"109\" text-anchor=\"middle\" font-size=\"9\">thread pool 執行緒</text></svg><figcaption>跑在同進程的另一條執行緒，非另開行程。</figcaption></figure></div>", "links": [["tools-1", "委派沿用相同工具協定：Tools"]], "src": "CH.07", "impl": ["呼叫鏈：child.run_conversation(user_message=goal, ...) 送進執行緒池（_timeout_executor.submit）。"], "cover": false, "subtitle": ""}, {"id": "multiagent-4", "title": "背景執行", "bullets": ["頂層委派：強制背景執行，父層立即取得任務代號繼續執行。", "orchestrator（被授權可以再往下派工的子 Agent 角色）再往下委派：強制同步等待結果。", "深度預設扁平，多層委派需顯式設定 orchestrator 角色。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 500 130\" role=\"img\" aria-label=\"background 由深度強制決定，非模型自選\"><defs><marker id=\"arrow29\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"10\" y=\"10\" width=\"220\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"120\" y=\"34\" text-anchor=\"middle\" font-size=\"12\">depth = 0（頂層呼叫）</text><path class=\"dg-line\" d=\"M120 50 L120 80\" marker-end=\"url(#arrow29)\"/><text class=\"dg-mono\" x=\"100\" y=\"68\" font-size=\"10\">強制</text><rect class=\"dg-box accent\" x=\"10\" y=\"80\" width=\"220\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"120\" y=\"102\" text-anchor=\"middle\" font-size=\"12\">background = True</text><rect class=\"dg-box\" x=\"270\" y=\"10\" width=\"220\" height=\"40\" rx=\"8\"/><text class=\"dg-text\" x=\"380\" y=\"34\" text-anchor=\"middle\" font-size=\"12\">depth ＞ 0（orchestrator 委派）</text><path class=\"dg-line\" d=\"M380 50 L380 80\" marker-end=\"url(#arrow29)\"/><text class=\"dg-mono\" x=\"360\" y=\"68\" font-size=\"10\">強制</text><rect class=\"dg-box accent\" x=\"270\" y=\"80\" width=\"220\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"380\" y=\"102\" text-anchor=\"middle\" font-size=\"12\">background = False</text></svg><figcaption>頂層委派恆為背景；orchestrator 再往下委派恆為同步。</figcaption></figure></div>", "links": [], "src": "CH.07", "impl": ["判斷函式 _model_background_value()：depth=0 一律 background=True，depth&gt;0 一律 background=False；MAX_DEPTH 預設 1。"], "cover": false, "subtitle": ""}, {"id": "multiagent-5", "title": "Mixture of Agents", "bullets": ["單一模型的判斷可能有偏差或遺漏——Mixture of Agents（MoA）讓多個「顧問」（Reference）模型各自先分析，再由一個 Aggregator 彙總、真正動手。", "不是額外的迴圈，而是包裝成一個虛擬的 model provider——選它就跟選任何一個模型一樣。"], "diagram": "<div class=\"diagram\"><figure><svg viewBox=\"0 0 460 170\" role=\"img\" aria-label=\"MoA：Reference 產出分析，Aggregator 唯一動手\"><defs><marker id=\"arrow30\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><polygon points=\"0,0 6,3 0,6\" fill=\"currentColor\"/></marker></defs><rect class=\"dg-box\" x=\"20\" y=\"15\" width=\"140\" height=\"44\" rx=\"8\"/><text class=\"dg-text\" x=\"90\" y=\"31\" text-anchor=\"middle\" font-size=\"12\">Reference A</text><text class=\"dg-mono\" x=\"90\" y=\"46\" text-anchor=\"middle\" font-size=\"9\">無工具權限</text><rect class=\"dg-box\" x=\"20\" y=\"71\" width=\"140\" height=\"44\" rx=\"8\"/><text class=\"dg-text\" x=\"90\" y=\"87\" text-anchor=\"middle\" font-size=\"12\">Reference B</text><text class=\"dg-mono\" x=\"90\" y=\"102\" text-anchor=\"middle\" font-size=\"9\">無工具權限</text><rect class=\"dg-box accent\" x=\"260\" y=\"45\" width=\"150\" height=\"60\" rx=\"8\"/><text class=\"dg-text\" x=\"335\" y=\"79\" text-anchor=\"middle\" font-size=\"12\">Aggregator</text><path class=\"dg-line\" d=\"M160 37 L260 68\" marker-end=\"url(#arrow30)\"/><path class=\"dg-line\" d=\"M160 93 L260 88\" marker-end=\"url(#arrow30)\"/><rect class=\"dg-box\" x=\"310\" y=\"120\" width=\"130\" height=\"36\" rx=\"8\"/><text class=\"dg-text\" x=\"375\" y=\"132\" text-anchor=\"middle\" font-size=\"12\">呼叫工具</text> var SLIDE_CLUSTER = {"cover-1": "cover", "intro-1": "intro", "intro-2": "intro", "core-1": "core", "tools-1": "tools", "tools-5": "tools", "tools-7": "tools", "tools-8": "tools", "tools-closing": "tools", "context-1": "context", "context-2": "context", "context-4": "context", "context-5": "context", "memory-1": "memory", "memory-3": "memory", "memory-4": "memory", "memory-6": "memory", "skills-1": "skills", "skills-2": "skills", "skills-3": "skills", "skills-4": "skills", "skills-5": "skills", "skills-6": "skills", "multiagent-0": "multiagent", "multiagent-1": "multiagent", "multiagent-2": "multiagent", "multiagent-3": "multiagent", "multiagent-4": "multiagent", "multiagent-5": "multiagent", "multiagent-6": "multiagent", "identity-5": "identity", "identity-6": "identity", "identity-8": "identity", "guidance-1": "guidance", "guidance-2": "guidance", "guidance-3": "guidance", "guidance-5": "guidance"};
var CLUSTER_ORDER = ["cover", "intro", "core", "tools", "context", "memory", "skills", "multiagent", "identity", "guidance"];

var clusterById = {};
CLUSTERS.forEach(function(c){ clusterById[c.id] = c; });
var slideById = {};
Object.keys(SLIDES).forEach(function(cid){ SLIDES[cid].forEach(function(s){ slideById[s.id] = s; }); });

function $(id){ return document.getElementById(id); }

function refreshDrawerHighlight(currentId){
  document.querySelectorAll('#drawer button[data-slide]').forEach(function(b){
    b.classList.toggle('current', b.getAttribute('data-slide') === currentId);
  });
}

function openSlide(slideId){
  var s = slideById[slideId];
  var cid = SLIDE_CLUSTER[slideId];
  var c = clusterById[cid];
  var list = SLIDES[cid];
  var idx = list.findIndex(function(x){ return x.id === slideId; });

  $('coverBlock').hidden = !s.cover;
  $('normalBlock').hidden = !!s.cover;
  if (s.cover){
    $('coverTitle').textContent = s.title;
    $('coverSubtitle').textContent = s.subtitle || '';
    $('crumb').innerHTML = '<b>' + c.label + '</b>';
    var pIdx0 = PLAY_ORDER.indexOf(slideId);
    $('progressLabel').textContent = (pIdx0+1) + ' / ' + PLAY_ORDER.length;
    $('progressBar').style.width = ((pIdx0+1)/PLAY_ORDER.length*100) + '%';
    window.scrollTo(0,0);
    $('slide').dataset.current = slideId;
    refreshDrawerHighlight(slideId);
    return;
  }

  $('eyebrowLabel').textContent = c.label;
  $('sTitle').textContent = s.title;
  $('crumb').innerHTML = '<b>' + c.label + '</b> — ' + c.gap + ' · ' + (idx+1) + '/' + list.length;

  var bullets = $('sBullets');
  bullets.innerHTML = '';
  s.bullets.forEach(function(b){
    var li = document.createElement('li');
    li.textContent = b;
    bullets.appendChild(li);
  });

  $('sDiagram').innerHTML = s.diagram || '';

  var implToggle = $('implToggle');
  var implBody = $('implBody');
  var implList = $('implList');
  implBody.classList.remove('open');
  implToggle.classList.remove('open');
  implToggle.querySelector('.arw').textContent = '▸';
  if (s.impl && s.impl.length > 1){
    implToggle.hidden = false;
    implList.innerHTML = '';
    s.impl.forEach(function(t){
      var li = document.createElement('li');
      li.innerHTML = t;
      implList.appendChild(li);
    });
  } else {
    implToggle.hidden = true;
    implBody.classList.remove('open');
  }

  var linksWrap = $('sLinks');
  linksWrap.innerHTML = '';
  if (s.links && s.links.length){
    var lbl = document.createElement('div');
    lbl.className = 'rl-label';
    lbl.textContent = '交叉引用：';
    linksWrap.appendChild(lbl);
    s.links.forEach(function(pair){
      var target = pair[0], text = pair[1];
      var btn = document.createElement('button');
      btn.className = 'rel-link';
      btn.textContent = text;
      var tcid = SLIDE_CLUSTER[target];
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '→ ' + clusterById[tcid].label;
      btn.appendChild(tag);
      btn.addEventListener('click', function(){ openSlide(target); closeDrawer(); });
      linksWrap.appendChild(btn);
    });
  }

  var pIdx = PLAY_ORDER.indexOf(slideId);
  $('progressLabel').textContent = (pIdx+1) + ' / ' + PLAY_ORDER.length;
  $('progressBar').style.width = ((pIdx+1)/PLAY_ORDER.length*100) + '%';

  window.scrollTo(0,0);
  $('slide').dataset.current = slideId;
  refreshDrawerHighlight(slideId);
}

function stepPlay(delta){
  var cur = $('slide').dataset.current;
  var i = PLAY_ORDER.indexOf(cur);
  var next = i + delta;
  if (next < 0 || next >= PLAY_ORDER.length) return;
  openSlide(PLAY_ORDER[next]);
}

function openDrawer(){ $('drawer').classList.add('open'); $('drawerBackdrop').classList.add('open'); }
function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerBackdrop').classList.remove('open'); }

document.querySelectorAll('#drawer [data-jump]').forEach(function(el){
  el.addEventListener('click', function(){ openSlide(el.getAttribute('data-jump')); closeDrawer(); });
});

$('outlineToggle').addEventListener('click', function(ev){ ev.stopPropagation(); openDrawer(); });
$('implToggle').addEventListener('click', function(ev){
  ev.stopPropagation();
  var open = $('implBody').classList.toggle('open');
  this.classList.toggle('open', open);
  this.querySelector('.arw').textContent = open ? '▾' : '▸';
});
$('drawerBackdrop').addEventListener('click', function(ev){ ev.stopPropagation(); closeDrawer(); });
$('drawer').addEventListener('click', function(ev){ ev.stopPropagation(); });

function toggleFullscreen(){
  if (!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    document.exitFullscreen();
  }
}
$('fsToggle').addEventListener('click', function(ev){ ev.stopPropagation(); toggleFullscreen(); });

document.addEventListener('click', function(ev){
  if ($('drawer').classList.contains('open')) return;
  if (ev.target.closest('button, a')) return;
  stepPlay(1);
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){
    if ($('drawer').classList.contains('open')) { closeDrawer(); }
    return;
  }
  if (ev.key >= '0' && ev.key <= '9'){
    var idx = ev.key === '0' ? 9 : parseInt(ev.key,10)-1;
    var cid = CLUSTER_ORDER[idx];
    if (cid) openSlide(SLIDES[cid][0].id);
    return;
  }
  if (ev.key === 'f' || ev.key === 'F'){ toggleFullscreen(); return; }
  if (ev.key === ' ' || ev.key === 'ArrowRight' || ev.key === 'PageDown'){ ev.preventDefault(); stepPlay(1); return; }
  if (ev.key === 'ArrowLeft' || ev.key === 'Backspace' || ev.key === 'PageUp'){ ev.preventDefault(); stepPlay(-1); return; }
});

openSlide(PLAY_ORDER[0]);
</script>
</body>
</html>
